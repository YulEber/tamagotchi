// Verbindung und Abgleich
async function cloudConnect(){
  if(!inChat()){CL.state="unavailable";CL.err="";return false;}
  CL.state="connecting";cloudUI();
  try{CL.db=await window.claude.use("db");CL.user=await window.claude.use("user");}catch(e){CL.db=null;}
  if(!CL.db){CL.state="unavailable";CL.err="Online speichern geht hier gerade nicht.";return false;}
  try{CL.uid=CL.user?await CL.user.id():null;}catch(e){CL.uid=null;}
  if(CM.mode==="me"&&!CL.uid){CL.state="unavailable";CL.err="Dafür musst du in Claude angemeldet sein.";return false;}
  try{CL.ref=CL.db.doc(CM.mode==="shared"?"shared/pet":"data/users/"+CL.uid+"/save");}catch(e){CL.ref=null;CL.state="unavailable";CL.err="Online speichern geht hier gerade nicht.";return false;}
  CL.blocked=false;return true;
}
function cloudFail(e){
  const c=e&&e.code;
  if(c==="invalid_argument"){CL.blocked=true;CL.state="error";CL.err=CM.mode==="shared"?"Du darfst hier nicht mitspeichern. Der Besitzer muss dich im Teilen-Menü per E-Mail als Bearbeiter einladen.":"Mit diesem Link darfst du nicht online speichern.";}
  else if(c==="quota_exceeded"){CL.blocked=true;CL.state="error";CL.err="Der Online-Speicher ist voll.";}
  else if(c==="revoked"||c==="not_granted"||c==="capability_disabled"||c==="capability_removed"){CL.blocked=true;CL.state="unavailable";CL.err="Online speichern ist gerade nicht erlaubt.";}
  else{CL.state="error";CL.err="Gerade keine Verbindung. Es wird gleich nochmal versucht.";}
  cloudUI();
}
async function cloudUp(force){
  if(!CL.ref||CL.blocked)return false;
  const h=cloudHash();if(!force&&h===CM.lastHash)return false;
  const st=JSON.stringify(cloudState());
  if(st.length>240000){CL.state="error";CL.err="Der Spielstand ist zu groß zum Online-Speichern.";return false;}
  const t=Math.max(Date.now(),CM.base+1,CL.seenT+1),body={v:CLOUD_V,t,dev:CM.dev,by:CL.uid||"",name:String(S.name).slice(0,16),lv:S.level|0,s:st};
  await CL.ref.set(body);
  CM.base=t;CM.lastHash=h;CM.lastT=Date.now();cmSave();CL.lastUp=Date.now();CL.hash=h;CL.state="ok";CL.err="";return true;
}
function cloudRun(fn){ // immer nur ein Schreiben gleichzeitig
  if(CL.busy)return Promise.resolve(false);CL.busy=true;
  return Promise.resolve().then(fn).catch(e=>{cloudFail(e);return false;}).finally(()=>{CL.busy=false;cloudUI();});
}
async function who(id){

  try{const ps=await CL.user.profiles([id]);return(ps&&ps[id]&&ps[id].name)||"Jemand";}catch(e){return"Jemand";}
}
function cloudApply(r,how){
  let st=null;try{st=JSON.parse(r.s);}catch(e){}
  if(!st||typeof st!=="object"||Array.isArray(st)||!(st.born>0)){CL.state="error";CL.err="Der Online-Spielstand ist beschädigt.";cloudUI();return false;}

function cloudListen(){
  if(CL.unsub||!CL.ref)return;
  try{CL.unsub=CL.ref.onSnapshot(snap=>{
    if(!snap||!snap.exists)return;const r=snap.data();if(!validRemote(r))return;CL.seenT=Math.max(CL.seenT,r.t);if(r.dev===CM.dev||r.t<=CM.base)return;
    CL.pending=r;cloudMaybeApply();
  },e=>{CL.unsub=null;cloudFail(e);});}catch(e){CL.unsub=null;}
}
function cloudMaybeApply(){
  const r=CL.pending;if(!r||CL.busy||CL.state==="conflict")return;
  if(G&&G.k!=="menu")return; // erst nach dem Spiel
  const a=document.activeElement;if(a&&(a.tagName==="INPUT"||a.tagName==="SELECT"||a.tagName==="TEXTAREA"))return;
  CL.pending=null;if(r.t<=CM.base)return;
  if(cloudHash()!==CM.lastHash&&CL.changeT>r.t){cloudRun(()=>cloudUp(true));return;} // hier ist es neuer: das hier gilt
  cloudApply(r,"live");

async function cloudStart(){
  if(!CM.on)return;
  if(CL.busy){setTimeout(cloudStart,600);return;} // erst das laufende Speichern abwarten
  await cloudRun(async()=>{
    if(!await cloudConnect())return;
    const snap=await CL.ref.get(),r=snap&&snap.exists?snap.data():null;
    if(validRemote(r))CL.seenT=Math.max(CL.seenT,r.t);
    if(validRemote(r)&&r.t>CM.base){
      if(cloudHash()===CM.lastHash||freshLocal())cloudApply(r,"load");
      else{CL.conflict=r;CL.state="conflict";openSheet("cloud");return;}
    }else await cloudUp(!validRemote(r));
    CL.state="ok";cloudListen();
  });
}
function cloudTick(){
  if(!CM.on||!CL.ref||CL.blocked||CL.state==="conflict")return;
  const h=cloudHash(),now=Date.now();if(h!==CL.hash){CL.hash=h;CL.changeT=now;}
  if(CL.pending){cloudMaybeApply();return;}
  if(h!==CM.lastHash&&now-CL.lastUp>=(CM.mode==="shared"?3000:12000)&&!(G&&G.k!=="menu"&&CM.mode!=="shared"))cloudRun(()=>cloudUp(false));
}

// Seite „Spielstand“
const tm=t=>{try{return new Date(t).toLocaleString("de-DE",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});}catch(e){return"";}};
function stLine(o){let st=null;try{st=typeof o==="string"?JSON.parse(o):o;}catch(e){}return st?`${esc(st.name||"Tierchen")} · Level ${st.level|0}`:"";}
function renderCloud(){
  const chat=inChat(),file=`<h3>Als Datei</h3><p class="note">Sichere den Spielstand als Datei und lade ihn auf einem anderen Gerät oder in der App wieder.</p>`+
    `<div class="row-btns cl-btns"><button type="button" class="buy" data-cl="export">💾 Datei sichern</button><button type="button" class="buy ghost" data-cl="import">📂 Datei laden</button></div><input type="file" id="clFile" accept=".json,application/json" hidden>`;
  if(CL.imp)return`<div class="cl-box warn"><b>Diesen Spielstand laden?</b><small>${stLine(CL.imp)}</small><p class="note">Dein Spielstand hier wird dabei ersetzt.</p>`+
    `<div class="row-btns cl-btns"><button type="button" class="buy" data-cl="impyes">Laden</button><button type="button" class="buy ghost" data-cl="impno">Abbrechen</button></div></div>`;
  if(!chat)return`<p class="note"><b>Online speichern</b> geht im Chat-Link: Dann ist dein Tierchen auf Handy und PC gleich, gespeichert in deinem Claude-Konto. Hier im Browser geht das nicht.</p>`+file;
  if(CL.state==="conflict"&&CL.conflict){const r=CL.conflict;
    return`<div class="cl-box warn"><b>Online gibt es einen anderen Spielstand.</b><p class="note">Welchen willst du behalten? Der andere wird ersetzt.</p>`+
      `<button type="button" class="cl-pick" data-cl="take"><b>🌐 Den online nehmen</b><small>${stLine(r.s)} · gespeichert ${tm(r.t)}</small></button>`+
      `<button type="button" class="cl-pick" data-cl="keep"><b>📱 Diesen hier behalten</b><small>${stLine(S)} · auf diesem Gerät</small></button></div>`;}
  const mode=(m,t,d)=>`<button type="button" class="cl-pick${CM.on&&CM.mode===m?" on":""}" data-cl="on-${m}"><b>${t}</b><small>${d}</small></button>`;
  let status;
  if(!CM.on)status=`<p class="note">Speichere dein Tierchen in deinem Claude-Konto. Dann ist es auf Handy und PC gleich, wenn du diesen Link öffnest.</p>`;
  else status=`<div class="cl-box${CL.state==="ok"?" ok":CL.state==="connecting"?"":" warn"}"><b>${CL.state==="ok"?"✓ Online gespeichert":CL.state==="connecting"?"Verbinde …":"⚠️ "+esc(CL.err||"Gerade nicht verbunden")}</b>`+
    `<small>${CM.mode==="shared"?"Gemeinsames Tierchen":"Nur für dich"}${CM.lastT?" · zuletzt "+tm(CM.lastT):""}${CL.byName&&CL.byName!=="Du"?" · zuletzt gepflegt von "+esc(CL.byName):""}</small>`+
    `<div class="row-btns cl-btns"><button type="button" class="buy" data-cl="save"${CL.blocked||!CL.ref?" disabled":""}>Jetzt speichern</button><button type="button" class="buy ghost" data-cl="load"${!CL.ref?" disabled":""}>${CL.ask==="load"?"Wirklich laden?":"Online-Stand laden"}</button><button type="button" class="buy ghost" data-cl="off">Ausschalten</button></div></div>`;
  return status+`<h3>${CM.on?"Art":"Einschalten"}</h3>`+
    mode("me","👤 Nur für mich","Dein Tierchen auf all deinen Geräten. Nur du siehst es.")+
    mode("shared","👥 Gemeinsam pflegen","Ein Tierchen für zwei. Lade die andere Person im Teilen-Menü mit ihrer E-Mail als Bearbeiter ein (nicht über einen öffentlichen Link). Dann öffnet sie denselben Link und wählt auch „Gemeinsam pflegen“. Ihr seht, wer es gefüttert hat.")+
    `<p class="note">Dein Foto-Gesicht und die Stimmen deines Geräts bleiben auf dem Gerät.</p>`+file;
}
SHEETS.cloud={r:renderCloud,label:"Spielstand",solo:true};
function cloudUI(){if(!$("sheet").hidden&&sheetTab==="cloud")renderSheet();}
$("bCloud").textContent=inChat()?"☁️ Spielstand online":"💾 Spielstand sichern";
$("bCloud").onclick=()=>openSheet("cloud");
$("sheetBody").addEventListener("click",e=>{
  const b=e.target.closest("[data-cl]");if(!b||b.disabled)return;const a=b.dataset.cl;beep(1320,.04);
  if(a==="on-me"||a==="on-shared"){const m=a.slice(3);if(!(CM.on&&CM.mode===m))cloudOn(m);cloudUI();}
  else if(a==="off")cloudOff();
  else if(a==="save")cloudRun(()=>cloudUp(true)).then(ok=>{if(ok)say("Online gespeichert",1600);});
  else if(a==="load"){if(CL.ask!=="load"){CL.ask="load";cloudUI();setTimeout(()=>{if(CL.ask==="load"){CL.ask="";cloudUI();}},3500);return;}
    CL.ask="";cloudRun(async()=>{const s=await CL.ref.get(),r=s&&s.exists?s.data():null;if(validRemote(r))cloudApply(r,"load");else say("Online ist noch nichts gespeichert.",2000);});}
  else if(a==="take"){const r=CL.conflict;CL.conflict=null;CL.state="ok";if(r)cloudApply(r,"load");cloudListen();}
  else if(a==="keep"){CL.conflict=null;CL.state="ok";cloudRun(()=>cloudUp(true)).then(()=>cloudListen());}
  else if(a==="export")exportSave();
  else if(a==="import"){const i=$("clFile");if(i)i.click();}
  else if(a==="impyes")importDo();
  else if(a==="impno"){CL.imp=null;cloudUI();}
});
$("sheetBody").addEventListener("change",e=>{
  if(e.target.id!=="clFile")return;const f=e.target.files&&e.target.files[0];e.target.value="";if(!f)return;
  if(f.size>3e6){say("Die Datei ist zu groß.",2000);return;}
  const rd=new FileReader();rd.onload=()=>importText(String(rd.result||""));rd.onerror=()=>say("Die Datei ließ sich nicht lesen.",2000);rd.readAsText(f);
});

// ===== Als App: Symbol auf dem Startbildschirm, Vollbild, auch ohne Internet =====
let instEv=null;
addEventListener("beforeinstallprompt",e=>{e.preventDefault();instEv=e;if(!$("sheet").hidden&&sheetTab==="app")renderSheet();});
addEventListener("appinstalled",()=>{instEv=null;say("Installiert! Das Tamagotchi ist jetzt auf deinem Startbildschirm.",3200);if(!$("sheet").hidden&&sheetTab==="app")renderSheet();});
function isApp(){try{return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;}catch(e){return false;}}
function isIOS(){try{return/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}catch(e){return false;}}
const pwaReady=()=>!!window.PWA&&/^https?:$/.test(location.protocol);
if(pwaReady()&&"serviceWorker"in navigator)addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{});});
function renderApp(){
  if(isApp())return`<div class="cl-box ok"><b>✓ Du spielst schon als App</b><small>Das Tamagotchi startet vom Startbildschirm, im Vollbild und auch ohne Internet.</small></div>`;
  if(inChat())return`<p class="note">So kommt das Tamagotchi als Symbol auf deinen Startbildschirm:</p>`+
    `<ol class="steps"><li>Öffne diesen Link im Browser deines Handys (Safari oder Chrome).</li><li>iPhone: unten auf <b>Teilen</b> tippen, dann <b>Zum Home-Bildschirm</b>.<br>Android: oben auf <b>⋮</b> tippen, dann <b>Zum Startbildschirm hinzufügen</b>.</li><li>Fertig: Ein Tipp aufs Symbol öffnet dein Tierchen.</li></ol>`+
    `<p class="note">Eine richtige App, die auch ohne Internet läuft, bekommst du mit der ZIP-Datei: Leg den Ordner auf eine eigene Webseite (Anleitung in LIESMICH.txt) und installiere sie von dort.</p>`;
  if(!pwaReady())return`<p class="note">Als App installieren geht nur, wenn das Spiel im Internet liegt (eine Adresse mit https). Direkt aus der Datei auf dem Handy klappt das nicht.</p>`+
    `<p class="note"><b>So geht's:</b> Lade den Ordner „Tamagotchi“ auf eine kostenlose Webseite hoch. Die Anleitung steht in LIESMICH.txt unter „Als App aufs Handy“.</p>`;
  if(instEv)return`<p class="note">Installiere das Tamagotchi als App: mit Symbol auf dem Startbildschirm, im Vollbild und auch ohne Internet.</p><button type="button" class="buy wide-go" data-app="install">📲 Jetzt installieren</button>`;
  if(isIOS())return`<p class="note">So installierst du das Tamagotchi auf dem iPhone oder iPad:</p><ol class="steps"><li>Öffne diese Seite in <b>Safari</b>.</li><li>Tippe unten auf <b>Teilen</b> (Viereck mit Pfeil).</li><li>Wähle <b>Zum Home-Bildschirm</b> und tippe auf <b>Hinzufügen</b>.</li></ol>`;
  return`<p class="note">So installierst du das Tamagotchi:</p><ol class="steps"><li>Tippe im Browser oben auf <b>⋮</b> (Chrome) oder auf das Menü.</li><li>Wähle <b>App installieren</b> oder <b>Zum Startbildschirm hinzufügen</b>.</li></ol><p class="note">Am Computer gibt es dafür oft ein kleines Symbol rechts in der Adresszeile.</p>`;
}
SHEETS.app={r:renderApp,label:"Als App",solo:true};
$("bApp").onclick=()=>openSheet("app");
$("sheetBody").addEventListener("click",async e=>{
  const b=e.target.closest("[data-app]");if(!b||!instEv)return;const ev=instEv;
  try{ev.prompt();const c=await ev.userChoice;if(c&&c.outcome==="accepted")instEv=null;}catch(er){}
  renderSheet();
});

// ===== Spielablauf =====
function start(k){
  if(!canPlay()){closePad();return;}
  G={k,id:++gid,round:0,max:5,score:0,hist:[],streak:0,phase:"ready",t:Date.now()};
  if(k==="lr"){
    setPad([{t:"← Links",f:()=>lrGuess(-1),cls:"main"},{t:"Rechts →",f:()=>lrGuess(1),cls:"main"},{t:"Abbrechen",f:quit,cls:"quit"}],2);
  }else if(k==="hl"){
    G.n=1+Math.floor(Math.random()*9);
    setPad([{t:"↓ Tiefer",f:()=>hlGuess(-1),cls:"main"},{t:"Höher ↑",f:()=>hlGuess(1),cls:"main"},{t:"Abbrechen",f:quit,cls:"quit"}],2);
  }else if(k==="run"){
    Object.assign(G,{phase:"play",score:0,obs:[],gold:[],spawnT:1.4,speed:170,dist:0});
    setPad([{t:"Springen ⤴",f:runJump,cls:"main jump",down:true},{t:"Abbrechen",f:quit,cls:"quit"}],1);
  }else if(k==="pop"){
    Object.assign(G,{phase:"play",time:30,score:0,bal:[],spawnT:.4,lastX:180});
    setPad([{t:"Abbrechen",f:quit,cls:"quit"}],1);
  }else if(k==="catch"){
    Object.assign(G,{phase:"play",time:30,score:0,items:[],spawnT:.6,px:P.x});
    setPad([{t:"◀",f:()=>catchMove(-1),rep:true,cls:"big main"},{t:"▶",f:()=>catchMove(1),rep:true,cls:"big main"},{t:"Abbrechen",f:quit,cls:"quit"}],2);
  }else if(k==="mem"){
    memSetup();
  }else if(XG[k]){
    XG[k].start();
  }else{ // Schwierigkeit wächst mit dem Alter
    const st=stage();
    G.range=st==="baby"?10:st==="kid"?20:50;G.tries=st==="baby"?4:st==="kid"?5:6;
    G.secret=1+Math.floor(Math.random()*G.range);
    G.lo=1;G.hi=G.range;G.pick=Math.ceil(G.range/2);G.used=0;G.hint=0;G.won=false;
    setPad([{t:"−",f:()=>numStep(-1),rep:true,cls:"big"},{t:"Tipp!",f:numGuess,cls:"main"},{t:"+",f:()=>numStep(1),rep:true,cls:"big"},{t:"Abbrechen",f:quit,cls:"quit"}],3);
  }
  ui();tune([660,880,1320],.07);
}
function quit(){closePad();say("Schade!",1200);}
function result(ok,label){
  G.hist.push(ok);
  const r=petR(stage());
  if(ok){G.score++;G.streak++;tune([988,1319],.07);jump(220);emit("heart",P.x,GROUND-r*1.9,3,{spread:50});}
  else{G.streak=0;tune([330,220],.12);P.squash=.3;}
  say(label||(ok?(G.streak>=3?`Serie ×${G.streak}!`:"Treffer!"):"Daneben"),1200);
}
function next(){
  if(G.round>=G.max){finish();return;}
  if(G.k==="hl")G.n=G.m;
  G.phase="ready";G.t=Date.now();
}
function lrGuess(g){
  if(!G||G.phase!=="ready")return;
  G.round++;G.look=Math.random()<.5?-1:1;G.ok=g===G.look;
  G.phase="spin";G.t=Date.now();beep(1000,.03);
  later(500,()=>{G.phase="reveal";G.t=Date.now();result(G.ok);});
  later(1700,next);
}
function hlGuess(g){
  if(!G||G.phase!=="ready")return;
  let m;do{m=1+Math.floor(Math.random()*9);}while(m===G.n);
  G.round++;G.m=m;G.pickDir=g;G.ok=(m>G.n)===(g>0);
  G.phase="spin";G.t=Date.now();beep(1000,.03);
  later(700,()=>{G.phase="reveal";G.t=Date.now();result(G.ok,`${G.n} → ${G.m}: ${G.ok?"Treffer!":"Daneben"}`);});
  later(2000,next);
}
function numStep(d){
  if(!G||G.phase!=="ready")return;
  const p=Math.max(G.lo,Math.min(G.hi,G.pick+d));
  if(p!==G.pick){G.pick=p;beep(1600,.02,.03);}
}
function numGuess(){
  if(!G||G.phase!=="ready")return;
  const p=G.pick;G.used++;G.phase="spin";G.t=Date.now();beep(1000,.03);
  later(600,()=>{
    G.phase="reveal";
    if(p===G.secret){G.won=true;tune([784,988,1175,1568],.09);say("Gefunden!",1600);jump();later(1500,finish);return;}
    G.hint=p<G.secret?1:-1;
    if(G.hint>0)G.lo=p+1;else G.hi=p-1;
    G.pick=Math.max(G.lo,Math.min(G.hi,p));
    if(G.used>=G.tries){tune([392,330,262],.14);say("Es war die "+G.secret,2200);later(2200,finish);return;}
    beep(G.hint>0?880:440,.12);say(G.hint>0?"Höher!":"Tiefer!",1500);
    later(600,()=>{G.phase="ready";});
  });
}
function finish(){
  const k=G.k;let stars,line,key=k,val,better;
  if(k==="run"){
    stars=G.score>=25?3:G.score>=12?2:G.score>=4?1:0;line=`${G.score} Punkte`;val=G.score;better=val>0&&(S.best.run==null||val>S.best.run);
  }else if(k==="pop"){
    stars=G.score>=30?3:G.score>=18?2:G.score>=8?1:0;line=`${G.score} Ballons geplatzt`;val=G.score;better=val>0&&(S.best.pop==null||val>S.best.pop);
  }else if(k==="catch"){
    stars=G.score>=20?3:G.score>=12?2:G.score>=5?1:0;line=`${G.score} Obst gefangen`;val=G.score;
    better=val>0&&(S.best.catch==null||val>S.best.catch);S.catchBest=Math.max(S.catchBest,val);
  }else if(k==="mem"){
    stars=G.moves<=9?3:G.moves<=13?2:1;line=`Geschafft in ${G.moves} Zügen`;val=G.moves;
    better=S.best.mem==null||val<S.best.mem;S.memWins++;
  }else if(k==="num"){
    stars=!G.won?0:G.used<=Math.ceil(G.tries/2)?3:G.used<G.tries?2:1;
    line=G.won?`In ${G.used} Versuch${G.used>1?"en":""}`:"Es war die "+G.secret;
    key="num"+G.range;val=G.used;better=G.won&&(S.best[key]==null||val<S.best[key]);
  }else if(XG[k]&&XG[k].result){
    ({stars,line,val}=XG[k].result());better=val>0&&(S.best[key]==null||val>S.best[key]);
  }else{
    stars=G.score>=5?3:G.score>=3?2:G.score>=1?1:0;
    line=`${G.score} von ${G.max} richtig`;val=G.score;better=val>0&&(S.best[key]==null||val>S.best[key]);
  }
  if(better)S.best[key]=val;
  const joy=[6,12,20,30][stars],coins=Math.round(([2,5,10,15][stars]+(k==="catch"?Math.floor(G.score/4):k==="run"?Math.floor(G.score/5):k==="pop"?Math.floor(G.score/6):XG[k]&&XG[k].bonus?XG[k].bonus():0))*(festOn("weltkindertag")?1.5:1)),sk=stars>=2?"win":"lose";
  S.happy=clamp(S.happy+joy*(has("play")?1.25:1));trait("play",3);S.energy=clamp(S.energy-8);S.weight=Math.max(1,S.weight-1);S.coins+=coins;S.nGames++;hear(sk);
  addXP(4+stars*4);questAdd("play");if(stars>=2)questAdd("win");wishDone("game",k);diaryAdd("game",k);
  if(stars>=2)S.wins=(S.wins||0)+1;
  Object.assign(G,{phase:"end",stars,line,joy,coins,rec:better,say:SAY[sk][0]+" – "+SAY[sk][1],t:Date.now()});
  for(const f of GAME_DONE)f(k,stars,G);
  bumpCoins();
  save();
  setPad([{t:"Nochmal",f:()=>start(k),cls:"main"},{t:"Fertig",f:closePad}],2);
  ui();
  if(stars>=2){emit("confetti",180,-10,46,{spread:340,vy:-30,vx:120,life:2.6,g:160,s:1.3,cols:["#FF5C8D","#FFC94A","#2EA6FF","#22A869","#FF9A3D"]});jump(260);}
  setTimeout(()=>tune(stars>=2?[784,988,1175,1568,2093]:[523,659,523],.1),200);
}
document.addEventListener("keydown",e=>{
  if(!G||G.k==="menu"||G.phase==="end"||e.target.tagName==="INPUT"||e.target.tagName==="SELECT"||e.target.tagName==="TEXTAREA")return;
  const map=XG[G.k]?XG[G.k].keys:{lr:{ArrowLeft:()=>lrGuess(-1),ArrowRight:()=>lrGuess(1)},
    hl:{ArrowUp:()=>hlGuess(1),ArrowDown:()=>hlGuess(-1)},
    catch:{ArrowLeft:()=>catchMove(-1),ArrowRight:()=>catchMove(1)},
    run:{" ":runJump,ArrowUp:runJump},
    dream:{ArrowUp:()=>{G.ty-=24;},ArrowDown:()=>{G.ty+=24;}},
    num:{ArrowUp:()=>numStep(1),ArrowRight:()=>numStep(1),ArrowDown:()=>numStep(-1),ArrowLeft:()=>numStep(-1),Enter:numGuess}}[G.k];
  const f=map&&map[e.key];if(f){e.preventDefault();f();}
});

// ===== Start =====
const gap=Date.now()-S.last;

buildStats();muteLabel();dayRoll();
setInterval(()=>{catchUp();farmTick();swMaybe();wishTick();dayRoll();wxTick();festTick();wxAuto();save();ui();},5000);
addEventListener("pagehide",save);document.addEventListener("visibilitychange",()=>{if(document.hidden)save();});
catchUp();farmTick();
const today=new Date().toDateString();
if(S.bonusDay!==today){S.bonusDay=today;S.coins+=15;setTimeout(()=>{say("Tagesbonus: +15 Münzen",2400);bumpCoins();tune([988,1319,1568],.08);},2800);}
save();ui();
setTimeout(()=>{if(S.bond>=60&&!S.dead&&!S.sleep&&stage()!=="egg"){emit("heart",P.x,GROUND-90,8,{spread:70});setTimeout(()=>say(`${S.name} freut sich riesig, dass du da bist!`,2600),300);}},1500);
setTimeout(()=>{const h=new Date().getHours();if(!S.dead&&!S.sleep&&stage()!=="egg")speak(gap>3*3600000?"miss":h>=5&&h<11?"morning":h>=17||h<5?"evening":"how");},1200);
setTimeout(wxAuto,1500);
setTimeout(()=>{if(!S.wxIntro){S.wxIntro=1;save();say("Neu: Wetter, Jahreszeiten und Feste! Tippe oben rechts auf das Wetter.",4200);}},4200);
setTimeout(()=>{if(!S.introLook){S.introLook=1;save();say("Neu: Farbe, Foto-Gesicht und Stimme! Tippe oben rechts auf das Charakter-Schild.",4600);}},S.wxIntro?4200:9200);
setTimeout(()=>{if(!S.intro15){S.intro15=1;save();say("Neu: Bisaya lernen, Haustier, Möbel, Abenteuer, Tanzen, Angeln und Fotos! Schau in den Laden.",5200);}},S.wxIntro&&S.introLook?4200:14200);
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
