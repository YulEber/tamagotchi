<style>
/* Layout: eine App-Spalte – Kopfzeile, Bühne mit Tageszeit-Himmel, Werte-Ringe, Hinweis, Aktions-Leiste */
:root{
  --bg:#EDF0F6;--surface:#FFFFFF;--surface-2:#F3F5FA;--line:#DEE3ED;
  --fg:#1D2131;--muted:#697086;
  --accent:#FF6B4A;--accent-ink:#FFFFFF;
  --c-food:#FF9A3D;--c-mood:#FF5C8D;--c-energy:#EDAE00;--c-clean:#2EA6FF;--c-med:#22A869;--c-sleep:#7B6CF6;
  --c-low:#F04848;--c-ok:#22A869;
  --shadow:0 10px 30px rgba(32,40,70,.10);
  --f-display:"Fredoka",ui-rounded,system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1118;--surface:#191C26;--surface-2:#232735;--line:#2C3142;--fg:#EEF0F6;--muted:#9AA1B6;--accent:#FF7B5E;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1118;--surface:#191C26;--surface-2:#232735;--line:#2C3142;--fg:#EEF0F6;--muted:#9AA1B6;--accent:#FF7B5E;--shadow:0 10px 30px rgba(0,0,0,.35);color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 28px}
.app{max-width:440px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.who{min-width:0}
.name{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:0;border:0;background:none;cursor:pointer;
  font-family:var(--f-display);font-weight:600;font-size:28px;line-height:1.1;color:var(--fg)}
.name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name svg{width:16px;height:16px;opacity:.4}
.name-in{width:12ch;max-width:100%;padding:2px 8px;border:2px solid var(--accent);border-radius:12px;background:var(--surface);color:var(--fg);
  font-family:var(--f-display);font-weight:600;font-size:24px}
.sub{margin:3px 0 0;color:var(--muted);font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.round{flex:none;display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:50%;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);cursor:pointer}
.round svg{width:20px;height:20px}

.stage{position:relative;aspect-ratio:360/300;max-width:100%;border-radius:28px;overflow:hidden;background:#8FD3FF;box-shadow:var(--shadow);
  touch-action:manipulation;-webkit-user-select:none;user-select:none}
.stage canvas{display:block;width:100%;height:100%;cursor:pointer}
.hud{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;
  border-radius:16px;background:rgba(255,255,255,.86);color:#1D2131;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hud b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.hud small{font-size:12px;font-weight:700;color:#5F667A}
.dots{display:flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:#D3D8E3;transition:background .2s}
.dots i.hit{background:var(--c-ok)}.dots i.miss{background:var(--c-low)}.dots i.on{background:var(--accent)}
.toast{position:absolute;top:14px;left:50%;transform:translate(-50%,-8px);opacity:0;pointer-events:none;white-space:nowrap;
  padding:8px 14px;border-radius:999px;background:rgba(20,24,40,.82);color:#FFFFFF;font-weight:800;font-size:14px;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hud:not([hidden])~.toast{top:64px}
.card,.think,.result{position:absolute;background:#FFFFFF;color:#1D2131;box-shadow:0 10px 24px rgba(20,30,60,.18)}
.card{right:9%;top:25%;width:26%;aspect-ratio:3/4;border:3px solid transparent;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:border-color .2s}
.card b{font-family:var(--f-display);font-weight:600;font-size:clamp(40px,13vw,58px);line-height:1}
.card small{min-height:1.2em;font-size:12px;font-weight:700;color:#7A8094}
.card.ok{border-color:var(--c-ok)}.card.bad{border-color:var(--c-low)}
.card.spin{animation:flip .7s ease-in-out}
@keyframes flip{50%{transform:rotateY(90deg)}}
.think{right:6%;top:17%;width:48%;padding:12px 8px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:4px}
.think::before,.think::after{content:"";position:absolute;border-radius:50%;background:#FFFFFF}
.think::before{width:14px;height:14px;left:-2px;bottom:-12px}
.think::after{width:8px;height:8px;left:-14px;bottom:-24px}
.think b{font-family:var(--f-display);font-weight:600;font-size:clamp(36px,12vw,50px);line-height:1;font-variant-numeric:tabular-nums}
.think small{font-size:12px;font-weight:700;color:#7A8094}
.think.pulse b{animation:pulse .25s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.12);opacity:.55}}
.chip{display:inline-block;padding:4px 10px;border-radius:999px;background:#EEF1F6;color:#4A5064;font-size:12px;font-weight:800}
.chip.warn{background:#FFF0D6;color:#8F5500}.chip.ok{background:#DDF5E8;color:#137A48}.chip.rec{background:#FFE3EC;color:#B0204F}
.result{top:14px;left:50%;transform:translateX(-50%);width:min(80%,300px);padding:14px 16px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:6px;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
.result b{font-family:var(--f-display);font-weight:600;font-size:20px}
.result .row{display:flex;flex-wrap:wrap;justify-content:center;gap:6px}
.stars{display:flex;gap:6px;font-size:30px;line-height:1}
.stars span{color:#D8DCE6}
.stars span.on{color:#F5B400;animation:star .45s backwards}
.stars span:nth-child(2){animation-delay:.12s}.stars span:nth-child(3){animation-delay:.24s}
@keyframes star{from{transform:scale(0) rotate(-45deg)}}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;padding:12px 6px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.stat{position:relative;display:grid;justify-items:center;gap:4px}
.stat svg{width:52px;height:52px;transform:rotate(-90deg)}
.stat circle{fill:none;stroke-width:5}
.stat .trk{stroke:var(--line)}
.stat .val{stroke:var(--c);stroke-linecap:round;transition:stroke-dasharray .6s ease,stroke .3s}
.stat .num{position:absolute;top:0;left:0;right:0;height:52px;display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;font-weight:800;color:var(--muted)}
.stat.low .val{stroke:var(--c-low)}
.stat.low span{color:var(--c-low)}
.stat.low svg{animation:throb 1.2s ease-in-out infinite}
@keyframes throb{50%{transform:rotate(-90deg) scale(1.08)}}

.hint{margin:0;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;font-size:14px;line-height:1.45}
.hint::before{content:"";flex:none;width:10px;height:10px;margin-top:5px;border-radius:50%;background:var(--c-ok)}
.hint.warn::before{background:var(--c-low)}
.hint .small{display:block;margin-top:4px;color:var(--muted);font-size:12px}

.dock{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:8px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow)}
.dock button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 2px 8px;border:0;border-radius:16px;background:transparent;cursor:pointer;
  font-weight:800;font-size:11px;transition:background .15s,transform .1s}
.dock button svg{width:26px;height:26px;color:var(--ic,currentColor)}
.dock button:hover{background:var(--surface-2)}
.dock button:active{transform:scale(.93)}
.dock .main,.dock .main:hover{background:var(--accent);color:var(--accent-ink)}
.dock button:disabled{opacity:.35;cursor:default;transform:none}
@media (max-width:350px){.dock{grid-template-columns:repeat(3,minmax(0,1fr))}}

.pad{display:grid;grid-template-columns:repeat(var(--n,2),minmax(0,1fr));gap:10px}
.pad button{padding:14px 10px;border:0;border-radius:18px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer;
  font-family:var(--f-display);font-weight:600;font-size:17px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:transform .1s}
.pad button:active{transform:scale(.96)}
.pad button small{display:block;margin-top:2px;font-family:var(--f-body);font-weight:700;font-size:12px;color:var(--muted)}
.pad .main{background:var(--accent);color:var(--accent-ink)}
.pad .big{font-size:30px;line-height:1;padding:10px}
.pad .game{text-align:left;padding:14px 16px}
.pad .quit{grid-column:1/-1;padding:6px;background:transparent;box-shadow:none;color:var(--muted);font-family:var(--f-body);font-weight:800;font-size:14px}
.foot{display:flex;justify-content:center}
.link{padding:6px;border:0;background:none;color:var(--muted);font-weight:800;font-size:13px;text-decoration:underline;cursor:pointer}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>
.top-r{flex:none;display:flex;align-items:center;gap:8px}
.coins{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px 0 10px;border:0;border-radius:999px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);cursor:pointer;
  font-family:var(--f-display);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF2B0,#FFC531 55%,#E59B00);box-shadow:inset 0 0 0 2px rgba(180,110,0,.35)}
.coins.bump{animation:bump .45s}
@keyframes bump{40%{transform:scale(1.15)}}
.res-say{font-size:13px;font-weight:800;color:#C2185B}
.say{position:absolute;left:50%;top:40%;transform:translate(-50%,-100%);max-width:72%;padding:8px 12px;border-radius:16px;background:#FFFFFF;color:#1D2131;
  box-shadow:0 8px 20px rgba(20,30,60,.18);text-align:center;pointer-events:none;animation:sayin .25s ease}
.say::after{content:"";position:absolute;left:50%;bottom:-6px;width:12px;height:12px;border-radius:2px;background:#FFFFFF;transform:translateX(-50%) rotate(45deg)}
.say b{display:block;font-family:var(--f-display);font-weight:600;font-size:16px;color:#C2185B}
.say small{display:block;font-size:12px;font-weight:700;color:#6A7186}
.say .new{display:inline-block;margin-bottom:3px;padding:1px 7px;border-radius:999px;background:#FFE3EC;color:#B0204F;font-size:10px;font-weight:800}
@keyframes sayin{from{opacity:0;transform:translate(-50%,-88%) scale(.9)}}
.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,12,24,.45);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;margin:0 auto;max-width:480px;max-height:82vh;display:flex;flex-direction:column;gap:10px;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  background:var(--surface);color:var(--fg);border-radius:24px 24px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.grab{width:40px;height:5px;margin:0 auto;border-radius:3px;background:var(--line)}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;padding:4px;border-radius:14px;background:var(--surface-2)}
.tabs button{padding:8px 2px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-weight:800;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--surface);color:var(--fg);box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sheet-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
.sheet-body h3{margin:16px 0 8px;font-family:var(--f-display);font-weight:600;font-size:17px}
.note{margin:4px 0 10px;color:var(--muted);font-weight:700;font-size:13px;line-height:1.4}
.note b{color:var(--fg)}
.empty{margin:28px 0;text-align:center;color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:2px solid transparent;border-radius:16px;background:var(--surface-2);color:var(--fg);text-align:center;font:inherit}
.item .em{font-size:30px;line-height:1.1}
.item b{font-family:var(--f-display);font-weight:600;font-size:15px}
.item small{color:var(--muted);font-weight:700;font-size:12px;line-height:1.3}
.item.on{border-color:var(--accent)}
.item.locked{opacity:.5}
.grid.four .item{padding:10px 4px}.grid.four .item b{font-size:13px}.grid.four .item small{font-size:11px}
.pick{cursor:pointer}
.buy{margin-top:4px;padding:7px 12px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;cursor:pointer}
.buy:disabled{background:var(--line);color:var(--muted);cursor:default}
.list{display:flex;flex-direction:column;gap:8px}
.ach{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.ach>div{flex:1;min-width:0}
.ach b{display:block;font-family:var(--f-display);font-weight:600;font-size:15px}
.ach small{display:block;color:var(--muted);font-weight:700;font-size:12px}
.ach .chip{flex:none;white-space:nowrap}
.bar{height:6px;margin-top:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.ach.done .bar i{background:var(--c-ok)}
.word{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface-2)}
.word b{font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--c-mood)}
.word small{color:var(--muted);font-weight:700;font-size:13px}
.word.locked{opacity:.55}.word.locked b{color:var(--muted)}
.vocab{display:flex;flex-wrap:wrap;gap:6px}
.vocab span{padding:6px 10px;border-radius:999px;background:var(--surface-2);font-size:13px;font-weight:700}
.vocab b{color:var(--c-mood)}
.sheet-close{flex:none;padding:12px;border:0;border-radius:14px;background:var(--surface-2);color:var(--fg);font-weight:800;cursor:pointer}
.pad button:disabled{opacity:.45;cursor:default;transform:none}
.pad .mcard{aspect-ratio:1/1.05;padding:4px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);
  font-family:var(--f-body);font-weight:800;font-size:13px;line-height:1.15;overflow-wrap:anywhere;transition:background .15s}
.pad .mcard.open{background:var(--surface);color:var(--fg)}
.pad .mcard.open.b{color:var(--c-mood)}
.pad .mcard.done{background:#DDF5E8;color:#137A48}
.pad .mcard.miss{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.score{padding:4px 12px;border-radius:999px;background:var(--accent);color:#FFFFFF;font-family:var(--f-display);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
</style>
<style>
.xp{display:flex;align-items:center;gap:8px;margin-top:6px}
.xp b{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--accent);white-space:nowrap}
.xpbar{width:110px;max-width:40vw;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.xpbar i{display:block;width:0;height:100%;border-radius:4px;background:var(--accent);transition:width .5s}
.toast{white-space:normal;max-width:88%;text-align:center}
.toast.bottom{top:auto;bottom:14px;transform:translate(-50%,8px)}
.toast.bottom.show{transform:translate(-50%,0)}
.away{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 20px;
  border-radius:20px;background:rgba(255,255,255,.92);color:#1D2131;box-shadow:0 10px 24px rgba(20,30,60,.18);text-align:center}
.away span{font-size:36px;line-height:1.1}
.away b{font-family:var(--f-display);font-weight:600;font-size:16px}
.away small{font-size:13px;font-weight:800;color:#6A7186;font-variant-numeric:tabular-nums}
.postcard{position:absolute;inset:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:16px;border-radius:22px;
  background:#FFFFFF;color:#1D2131;box-shadow:0 12px 30px rgba(20,30,60,.25);text-align:center;animation:pop2 .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop2{from{transform:scale(.85) rotate(-3deg);opacity:0}}
.postcard .em{font-size:54px;line-height:1}
.postcard b{font-family:var(--f-display);font-weight:600;font-size:21px}
.postcard small{font-size:14px;font-weight:700;color:#5F667A;line-height:1.5}
.postcard strong{color:#1D2131}
.postcard button{margin-top:6px;padding:10px 22px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:600;font-size:16px;cursor:pointer}
.hint-btn{margin-left:6px;padding:5px 12px;border:0;border-radius:999px;background:#188A55;color:#FFFFFF;font-weight:800;font-size:13px;cursor:pointer}
.lvlcard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:16px;background:var(--surface-2)}
.lvlcard b{font-family:var(--f-display);font-weight:600;font-size:20px}
.lvlcard small{color:var(--muted);font-weight:700;font-size:12px;line-height:1.4}
.lvlcard .bar{height:10px;margin:0;border-radius:5px}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid.three .item{padding:10px 4px}.grid.three .item b{font-size:13px}.grid.three .item small{font-size:11px}
.trip-now{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 12px;border-radius:18px;background:var(--surface-2);text-align:center}
.trip-now .em{font-size:48px;line-height:1}
.trip-now b{font-family:var(--f-display);font-weight:600;font-size:18px}
.trip-now small{color:var(--muted);font-weight:800;font-variant-numeric:tabular-nums}
.pad .jump{padding:22px 10px;font-size:22px}
</style>
<style>
:root{--c-potty:#12A594}
.stats{grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;padding:12px 4px}
.tabs{grid-template-columns:repeat(5,minmax(0,1fr))}
.tabs button{font-size:12px;padding:8px 0}

const KEY="pixelpet-v1",MIN=60000;

  pers:{play:50,food:50,tidy:50,brave:50,cuddly:50},bond:0,wish:null,diary:[],dreams:[],day:null,family:[],elder:null,gen:1,skin:"rosa",babyEgg:null,
  wxLoc:null,wxLive:null,wxMan:null,wxSeen:[],seasonsSeen:[],fest:{},festN:0,festHi:{},eggs:null,adv:null,rockets:0,holi:"",
  ageOff:0,warm:0,teen:"",teens:[],senior:"",reps:[],cs:{n:0,h:0,c:0,f:0,e:0,l:0},life:{g:0,c:0,w:0,d:0},wet:0,teeth:100,schoolT:0,moodT:0,moodNext:0,noOK:0,workT:0,storyT:0,hobbyT:0,lifeNew:"",cry:null,nSchool:0,nWork:0,nStory:0,myRooms:[],floors:{},fix:{},furnGift:false,useT:{},bookI:0,nUse:0};
// ===== Lebensstufen: Ei, Baby, Kind, Teenie, Erwachsen, Oma/Opa =====
const STAGES=["egg","baby","kid","teen","adult","senior"];
const TEMPO={ // Ende jeder Stufe als Alter in Minuten: Ei, Baby, Kind, Teenie, Erwachsen. Danach Oma oder Opa, für immer.
  schnell:{n:"Schnell",d:"Erwachsen nach 1 Tag",t:[1,60,720,1440,5760]},
  normal:{n:"Normal",d:"Erwachsen nach 3 Tagen",t:[1,180,1440,4320,14400]},
  langsam:{n:"Langsam",d:"Erwachsen nach 7 Tagen",t:[1,360,2880,10080,30240]}};
let PREV=null; // beim Zeichnen der Vorschau-Bilder: so sähe es in einer anderen Stufe aus
const stRank=s=>Math.max(0,STAGES.indexOf(s));
const copy=o=>JSON.parse(JSON.stringify(o));
function fresh(){const n=Date.now();return Object.assign(copy(DEF),{born:n,last:n,hunger:80,happy:80,energy:90,clean:100,poops:0,sleep:false,sick:false,weight:5,dead:false,starve:0,poopTimer:0,tempo:"normal",stMax:"egg"});}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.born)return s;}catch(e){}return fresh();}
function save(){try{S.petX=P.x;}catch(e){}try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let S=load();
for(const k in DEF)if(S[k]===undefined||S[k]===null)S[k]=copy(DEF[k]);
lifeNorm();
function tempoT(){return(TEMPO[S.tempo]||TEMPO.normal).t;}
function lifeAge(){return(Date.now()-S.born-(S.ageOff||0))/MIN;} // Lebensalter in Minuten (mit Tempo und Wärmen)
function stageAt(a,t){let i=0;while(i<5&&a>=t[i])i++;return i;}
function stage(){
  if(PREV)return PREV.st;
  if(S.dead)return STAGES[stRank(S.stMax)];
  return STAGES[Math.max(stageAt(lifeAge(),tempoT()),stRank(S.stMax))]; // nie zurück in eine frühere Stufe
}
function lifeNorm(){ // beim Laden: alte Spielstände übernehmen und alles prüfen
  if(!TEMPO[S.tempo]||!STAGES.includes(S.stMax)){ // alter Spielstand: es bleibt in seiner Stufe, das neue Tempo gilt ab jetzt
    const a=Math.max(0,(Date.now()-S.born)/MIN),t=TEMPO.normal.t,old=S.form?4:a<.5?0:a<60?1:a<1440?2:4;

    if(old<4){const o0=[0,.5,60][old],o1=[.5,60,1440][old],s0=old?t[old-1]:0;e=s0+Math.min(.98,(a-o0)/(o1-o0))*(t[old]-s0);}
    S.tempo="normal";S.stMax=STAGES[old];S.ageOff=(a-e)*MIN;S.schoolT=Date.now()+60*MIN;S.workT=Date.now(); // Schule und Arbeit melden sich erst etwas später
  }

  for(const k of["teens","reps"])if(!Array.isArray(S[k]))S[k]=[];
  S.teens=S.teens.filter(k=>["sonne","wirbel","rebell"].includes(k));
  S.reps=S.reps.filter(r=>r&&typeof r==="object"&&STAGES.includes(r.st)&&Array.isArray(r.g)&&r.g.length===5&&r.g.every(v=>v>=1&&v<=6)).slice(-8);

function tick(){ // eine Minute Spielzeit

  if(S.sleep){S.energy=clamp(S.energy+2);S.hunger=clamp(S.hunger-0.4);if(S.energy>=100){S.sleep=false;if(S.sw||S.petRoom!=="schlaf"){S.sw=null;S.lost=1;S.happy=clamp(S.happy-5);}}}
  else{const m=S.trip?.5:1; // unterwegs sinkt alles langsamer
    S.hunger=clamp(S.hunger-1.2*m*(has("food")?1.2:1)*(bb?1.2:sen?.85:1));S.energy=clamp(S.energy-0.6*m*(has("play",false)?.8:1)*(bb||sen?1.3:1));S.happy=clamp(S.happy-(S.sick?2:0.9)*(S.owned.includes("teddy")?.75:1)*m*(has("cuddly",false)?.85:1)*(S.bond>=60?.9:1)*(st==="teen"?1.15:1));if(S.happy<20)trait("cuddly",-.3);
    S.careSum+=(S.hunger+S.happy+S.clean)/3-(S.sick?25:0);S.careN++;} // Pflege bestimmt die Entwicklung
  // Klo: sinkt mit der Zeit, bei 0 passiert ein Malheur
  if(!S.trip){S.potty=clamp(S.potty-(S.sleep?0.8:2.2)*(bb?1.15:1));S.clean=clamp(S.clean-(S.sleep?0.15:0.35)*(has("tidy")?.7:has("tidy",false)?1.3:1));}
  if(S.potty<=0&&!S.trip){
    if(bb){S.potty=0;if(!S.wet){S.wet=1;S.clean=clamp(S.clean-12);S.happy=clamp(S.happy-6);}} // Babys: die Windel ist voll
    else{S.potty=100;S.poops=Math.min(4,S.poops+1);S.clean=clamp(S.clean-20);S.happy=clamp(S.happy-(has("tidy",false)?3:10));trait("tidy",-4);if(window.diaryAdd)window.diaryAdd("accident");}}
  if(S.wet){S.clean=clamp(S.clean-.3);S.happy=clamp(S.happy-.4);}
  if(!bb){S.teeth=Math.max(0,S.teeth-.02);if(S.teeth<15)S.happy=clamp(S.happy-.2);} // ungeputzte Zähne tun irgendwann weh
  if(S.clean<15&&Math.random()<0.02*(sen?2:1))S.sick=true;
  if(sen&&!S.sleep&&Math.random()<.0012)S.sick=true; // Oma und Opa brauchen öfter Medizin
  if(S.poops>=3&&Math.random()<0.05)S.sick=true;
  if(S.hunger<=0&&Math.random()<0.02)S.sick=true;
  if(S.hunger<=0&&S.sick)S.starve++;else S.starve=Math.max(0,S.starve-1);
  if(S.starve>720)S.dead=true;
  const c=S.cs;c.n++;c.h+=S.hunger;c.c+=Math.max(0,S.clean-S.poops*10-(S.wet?20:0));c.f+=S.happy;c.e+=S.energy; // für das Zeugnis dieser Stufe
}

function beep(f,d=.08,vol=.04){
  if(muted)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();
    if(AC.state==="suspended")AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type="triangle";o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(vol*2,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);
  }catch(e){}
}
function tune(fs,step=.09){fs.forEach((f,i)=>setTimeout(()=>beep(f,step*.9),i*step*1000));}

  G.items=G.items.filter(o=>{
    o.y+=o.vy*dt;if(o.bee&&!RM)o.x+=Math.sin(T*6+o.wob)*40*dt;
    if(o.y>top-6&&o.y<top+r*.9&&Math.abs(o.x-P.x)<r*1.05){

function memSetup(){
  const pool=VOCAB.slice().sort(()=>Math.random()-.5).slice(0,6),cards=[];
  pool.forEach(([b,d],i)=>cards.push({t:b,p:i,b:true},{t:d,p:i,b:false}));
  cards.sort(()=>Math.random()-.5);
  Object.assign(G,{phase:"play",cards,open:[],moves:0,found:0,pairs:6,lock:false});
  setPad(cards.map((c,i)=>({t:"?",f:()=>memFlip(i),cls:"mcard"})).concat([{t:"Abbrechen",f:quit,cls:"quit"}]),4);
  G.btns=[...pad.querySelectorAll(".mcard")];
}
function memFlip(i){
  if(!G||G.k!=="mem"||G.lock)return;
  const c=G.cards[i],b=G.btns[i];if(c.done||G.open.includes(i))return;
  b.textContent=c.t;b.classList.add("open");b.classList.toggle("b",c.b);G.open.push(i);beep(1200,.03);
  if(G.open.length<2)return;
  G.moves++;
  const[a,z]=G.open,A=G.cards[a],Z=G.cards[z];
  if(A.p===Z.p){
    A.done=Z.done=true;G.found++;G.open=[];for(const j of[a,z])G.btns[j].classList.add("done");
    say(`${A.b?A.t:Z.t} = ${A.b?Z.t:A.t}`,1600);tune([988,1319],.07);jump(200);emit("heart",P.x,GROUND-90,2,{spread:40});
    if(G.found===G.pairs){G.lock=true;later(900,finish);}
  }else{
    G.lock=true;beep(330,.1);for(const j of G.open)G.btns[j].classList.add("miss");
    later(900,()=>{for(const j of G.open){const bt=G.btns[j];bt.textContent="?";bt.classList.remove("open","b","miss");}G.open=[];G.lock=false;});
  }
}

function ensureQuests(){ // jeden Tag drei neue Aufgaben
  const d=new Date().toDateString();if(S.q&&S.q.day===d)return;
  let h=7;for(const c of d)h=(Math.imul(h,31)+c.charCodeAt(0))>>>0;
  const ids=[];
  for(let i=0;ids.length<3&&i<300;i++){h=(Math.imul(h,1103515245)+12345)>>>0;const id=QPOOL[(h>>>8)%QPOOL.length].id;if(!ids.includes(id))ids.push(id);}
  for(const q of QPOOL)if(ids.length<3&&!ids.includes(q.id))ids.push(q.id);
  S.q={day:d,ids,prog:{},done:[]};save();
}
function questAdd(id,n=1){

    `<p class="note">EP bekommst du fürs Füttern, Putzen, Streicheln, für Spiele, Überraschungen, Ausflüge und Besuche.</p>`;

let EV=[],evT=12;
function spawnEvent(){
  const h=new Date().getHours(),night=S.sleep||h>=19||h<6,opts=[];
  if(S.sleep){if(night&&OUT.has(S.room))opts.push(["star",1]);}
  else if(OUT.has(S.room)){opts.push(["gift",30],["fly",25],["coins",15]);if(night)opts.push(["star",25]);if(unlockedFriends().length&&S.room==="garten")opts.push(["visitor",18]);}
  else{opts.push(["gift",20],["coins",10]);if(unlockedFriends().length&&S.room==="wohn")opts.push(["visitor",15]);}
  if(!opts.length)return;
  let r=Math.random()*opts.reduce((s,o)=>s+o[1],0),type=opts[0][0];
  for(const[k,w]of opts){if(r<w){type=k;break;}r-=w;}
  if(type==="gift"){EV.push({type,x:60+Math.random()*240,y:-30,vy:0,t:0,life:25});say("Da fällt ein Geschenk vom Himmel!",2000);}
  else if(type==="fly"){const dir=Math.random()<.5?1:-1;EV.push({type,dir,x:dir>0?-20:W+20,by:110+Math.random()*60,y:140,t:0,life:16});}
  else if(type==="star")EV.push({type,x:-20,y:20+Math.random()*50,t:0,life:2.4});
  else if(type==="coins"){for(let i=0;i<8;i++)EV.push({type:"coin",x:30+Math.random()*300,y:-20,vy:150+Math.random()*60,delay:i*.35,t:0,life:8});say("Münzregen! Schnell antippen!",2000);}
  else{const fs=unlockedFriends(),id=fs[Math.floor(Math.random()*fs.length)];EV.push({type,id,x:W+40,t:0,life:30,phase:"in",stay:0});}
  if(type!=="coins")beep(1500,.05);
}
function updVisitor(e,dt){
  const f=FRIENDS[e.id];
  if(e.phase==="in"){e.x-=70*dt;if(e.x<=280){e.x=280;e.phase="stay";say(`${f.n} kommt zu Besuch: ${SAY.friend[0]} (${SAY.friend[1]})`,2800);hear("friend");}}
  else if(e.phase==="stay"){e.stay+=dt;if(e.stay>9){e.phase="out";const c=6+Math.floor(Math.random()*8);S.coins+=c;bumpCoins();say(`${f.n} hat dir ${c} Münzen dagelassen. ${SAY.bye[0]}`,2800);hear("bye");save();ui();}}
  else{e.x+=80*dt;if(e.x>W+50)e.gone=true;}
}
function updEvents(dt,st){
  if(!S.dead&&st!=="egg"&&!away()&&S.room!=="spiel"&&(!G||G.k==="menu")){evT-=dt;if(evT<=0){evT=35+Math.random()*45;spawnEvent();}}
  for(const e of EV){
    e.t+=dt;
    if(e.type==="gift"){if(!e.landed){e.vy+=700*dt;e.y+=e.vy*dt;if(e.y>=GROUND-12){e.y=GROUND-12;e.vy=-e.vy*.35;if(Math.abs(e.vy)<40){e.landed=true;e.vy=0;}}}}
    else if(e.type==="fly"){e.x+=e.dir*30*dt;e.y=e.by+Math.sin(e.t*2.2)*18;}
    else if(e.type==="star"){e.x+=260*dt;e.y+=70*dt;}
    else if(e.type==="coin"){if(e.t>e.delay){e.y=Math.min(GROUND-8,e.y+e.vy*dt);if(e.y>=GROUND-8)e.ground=(e.ground||0)+dt;}}
    else if(e.type==="visitor")updVisitor(e,dt);
  }
  EV=EV.filter(e=>e.t<e.life&&!e.gone&&!(e.type==="coin"&&e.ground>1.5)&&!(e.type==="fly"&&(e.x<-40||e.x>W+40)));
}
function tapEvent(x,y){
  for(let i=EV.length-1;i>=0;i--){
    const e=EV[i];if(e.type==="coin"&&e.t<=e.delay)continue;
    const ey=e.type==="visitor"?GROUND-42:e.y,rad=e.type==="star"?36:e.type==="visitor"?46:26;
    if(Math.hypot(x-e.x,y-ey)>rad)continue;
    if(e.type==="visitor"){
      if(e.hugged)return true;
      const f=FRIENDS[e.id];e.hugged=true;S.friends[e.id]=Math.min(100,(S.friends[e.id]||0)+5);S.happy=clamp(S.happy+5);addXP(5);questAdd("surprise");
      emit("heart",e.x,GROUND-100,5,{spread:50});say(`Du hast ${f.n} umarmt! ${SAY.like[0]}`,2200);hear("like");tune([1046,1318],.06);save();ui();return true;
    }
    EV.splice(i,1);catchEvent(e);return true;
  }
  return false;
}

function runJump(){if(!G||G.k!=="run"||G.phase!=="play")return;if(P.y===0&&P.vy===0){P.vy=-430;beep(880,.05);}}
function updRun(dt){
  if(G.phase!=="play")return;
  G.speed=Math.min(380,G.speed+7*dt);G.dist+=G.speed*dt;G.spawnT-=dt;
  if(G.spawnT<=0){
    const big=Math.random()<.35;G.obs.push({x:W+20,w:big?26:18,h:big?40:26,k:Math.random()<.5?"cactus":"rock"});
    if(Math.random()<.5)G.gold.push({x:W+80+Math.random()*60,y:GROUND-70-Math.random()*40});
    G.spawnT=Math.max(.75,1.6-G.speed/400)+Math.random()*.8;
  }
  const r=petR(stage()),px=P.x,py=GROUND+P.y-r*.8,rad=r*.7;
  for(const o of G.obs){
    o.x-=G.speed*dt;
    if(!o.passed&&o.x+o.w<px-rad){o.passed=true;G.score++;questAdd("jump");beep(1200,.03);}
    const nx=Math.max(o.x,Math.min(px,o.x+o.w)),ny=Math.max(GROUND-o.h,Math.min(py,GROUND));
    if(Math.hypot(px-nx,py-ny)<rad*.85){G.phase="done";P.squash=.4;beep(180,.25);say("Autsch!",1200);emit("spark",px,py,8,{spread:40,col:"#FFD43B"});later(900,finish);return;}
  }
  G.obs=G.obs.filter(o=>o.x>-40);
  for(const c of G.gold){c.x-=G.speed*dt;if(!c.got&&Math.hypot(px-c.x,py-c.y)<rad+8){c.got=true;G.score+=2;beep(1500,.05);emit("spark",c.x,c.y,4,{spread:12,col:"#FFD43B",s:.7});}}
  G.gold=G.gold.filter(c=>c.x>-20&&!c.got);
}
function drawRun(){
  cx.strokeStyle="rgba(40,110,50,.45)";cx.lineWidth=2;cx.lineCap="round";cx.beginPath();
  for(let i=0;i<12;i++){const x=wrap(i*37-G.dist,W+20)-10,y=GROUND+12+(i%3)*10;cx.moveTo(x,y);cx.lineTo(x-3,y-6);cx.moveTo(x,y);cx.lineTo(x+2,y-7);}

      else{cx.rect(x+w*.25,y-h,w*.5,h);cx.rect(x,y-h*.7,w*.3,h*.35);cx.rect(x+w*.7,y-h*.8,w*.3,h*.35);}

    }else{oval(o.x+o.w/2,GROUND-o.h*.42,o.w*.62,o.h*.48,"#8C94A6");oval(o.x+o.w*.4,GROUND-o.h*.6,o.w*.18,o.h*.12,"rgba(255,255,255,.35)");}
  }

function popAt(x,y){

}

function farmNorm(){ // alte Beete übernehmen (beim Laden und bei Spielständen aus Datei oder online)

}

const total=p=>CROPS[p.c].min*MIN,ripe=p=>p.c&&!p.dead&&p.g>=total(p);

const chance=(perMin,ms)=>Math.random()<1-Math.pow(1-perMin,ms/MIN);
function farmTick(){
  const now=Date.now();
  S.farm.forEach((p,i)=>{
    const dt=Math.max(0,now-p.t);p.t=now;if(i>=S.plots||!dt)return;
    if(!p.weed&&chance(.012,dt))p.weed=1;
    if(!p.c||p.dead||ripe(p))return;
    const rate=100/wdur(p.c),wet=Math.min(dt,p.wa/rate);
    p.wa=Math.max(0,p.wa-rate*dt);
    if(!p.bug)p.g=Math.min(total(p),p.g+wet*(p.fert?1.5:1)*(p.weed?.5:1)*(inSeason(p.c)?1.25:1));
    if(p.g>0)p.dry=p.wa>0?0:p.dry+(dt-wet);
    if(p.dry>DIE){p.dead=true;p.bug=0;}
    if(!p.bug&&p.g>0&&!ripe(p)&&chance(.02,dt)){p.bug=1;p.dmg=1;}
  });
  animalTick(S.hen,10*MIN,3,"eggs");
  if(S.owned.includes("cow")){if(!S.cow)S.cow={t:Date.now(),milk:0,f:100,acc:0,u:Date.now()};animalTick(S.cow,15*MIN,2,"milk");}
}
function animalTick(a,every,max,key){ // Tiere legen/geben nur, wenn sie gefüttert sind
  if(!a)return;const now=Date.now(),dt=Math.max(0,now-(a.u||now)),rate=100/(40*MIN),fed=Math.min(dt,a.f/rate);
  a.u=now;a.f=Math.max(0,a.f-rate*dt);a.acc=(a.acc||0)+fed;a[key]=a[key]||0;
  while(a.acc>=every&&a[key]<max){a[key]++;a.acc-=every;}if(a[key]>=max)a.acc=0;
}

function wishOptions(){ // mögliche Wünsche mit Gewicht, passend zum Charakter

  if(isCold(wv)&&foodAvail("cocoa"))w("eat","cocoa",3,"☕");

  if(eggState()&&eggState().found.length<5)w("eggs","",5,"🥚");
  if(fwTime())w("fireworks","",4,"🎆");
  const rooms=Object.keys(TO).filter(r=>r!==S.room);w("room",pickOne(rooms),has("brave")?3:1.5,"🗺️");
  w("game",pickOne(Object.keys(GN)),has("play")?4:1.5,"🎮");

  const fr=unlockedFriends();if(fr.length){const f=pickOne(fr);w("friend",f,has("cuddly")?3:1,FRIENDS[f].e);}
  w("shower","",has("tidy")?4:1,"🛁");
  const cl=Object.keys(ITEMS).filter(k=>ITEMS[k].slot&&S.owned.includes(k)&&S.wear[ITEMS[k].slot]!==k);if(cl.length){const k=pickOne(cl);w("wear",k,1.5,ITEMS[k].e);}

  w("pet","",has("cuddly")?4:1.5,"🤗");

function wishText(w){
  if(WISH_T[w.kind])return WISH_T[w.kind](w);

    case"eat":return`Ich möchte ${FOOD[w.arg].e} ${FOOD[w.arg].n} essen.`;
    case"room":return`Ich will ${TO[w.arg]}.`;
    case"game":return`Lass uns ${GN[w.arg]} spielen!`;
    case"trick":return`Ich will „${TRICK[w.arg].b}“ üben!`;
    case"friend":return`Ich vermisse ${FRIENDS[w.arg].n}!`;
    case"shower":return"Ich will duschen!";
    case"wear":return`Ich will ${ITEMS[w.arg].e} ${ITEMS[w.arg].n} tragen!`;
    case"trip":return`Ich will ${PLACES[w.arg].to}!`;
    case"snowman":return"Lass uns einen Schneemann bauen!";
    case"eggs":return"Ich will Ostereier suchen!";
    case"fireworks":return"Ich will Feuerwerk sehen!";
    default:return"Streichel mich!";

}
function newWish(){
  const o=wishOptions(),sum=o.reduce((s,x)=>s+x.g,0);let r=Math.random()*sum,c=o[0];
  for(const x of o){if(r<x.g){c=x;break;}r-=x.g;}
  S.wish={kind:c.kind,arg:c.arg,emo:c.emo,until:Date.now()+12*MIN};
  sayRaw("Gusto ko …",wishText(S.wish));save();ui();
}

}

}

function dayRoll(){
  const d=new Date().toDateString();
  if(S.day&&S.day.d===d)return;
  if(S.day&&S.day.d&&S.day.ev&&Object.keys(S.day.ev).length){S.diary.push({d:S.day.d,text:diaryText(S.day)});if(S.diary.length>30)S.diary.shift();}

}
function diaryAdd(type,val){
  dayRoll();const e=S.day.ev;
  if(type==="eat"||type==="game"){const m=type==="eat"?"ate":"games";e[m]=e[m]||{};e[m][val]=(e[m][val]||0)+1;}
  else if(DLIST[type]){const m=DLIST[type];e[m]=e[m]||[];if(!e[m].includes(val))e[m].push(val);}
  else if(type==="harvest"||type==="shower"||type==="accident")e[type]=(e[type]||0)+1;
  else if(type==="sw")e.sw=1;else if(type==="dream")e.dream=val;else if(type==="egg")e.egg=1;else if(type==="baby")e.baby=val;else if(type==="pers")e.pers=val;else if(type==="level")e.level=val;
  else if(type==="eggs")e.eggs=Math.max(e.eggs||0,val);else if(type==="snowman")e.snowman=1;else if(type==="ny")e.ny=1;
  else if(type==="n")e[val]=(e[val]||0)+1; // einfacher Zähler: diaryAdd("n","fish")

function astroSeason(d){const md=(d.getMonth()+1)*100+d.getDate();return md>=1221||md<320?"winter":md<621?"spring":md<923?"summer":"autumn";} // nach Kalender (Nordhalbkugel)
function seasonAt(d){
  const lat=homeLat();if(Math.abs(lat)<23.5)return"tropic";
  const s=astroSeason(d);return lat<0?FLIP[s]:s;
}
function season(){return seasonAt(new Date());}
function seasonLook(){const s=season();return s==="tropic"?"summer":s;}
function nextSeason(d){ // nächster Wechsel: {s, d}
  if(Math.abs(homeLat())<23.5)return null;
  const y=d.getFullYear(),t0=mkD(y,d.getMonth()+1,d.getDate());
  for(const yy of[y,y+1])for(const[m,dd,s]of SEASON_START){const t=mkD(yy,m,dd);if(t>t0)return{s:homeLat()<0?FLIP[s]:s,d:t};}
  return null;
}

// Sonnenauf- und -untergang (Näherung nach NOAA), in Stunden Gerätezeit
function sunTimes(d,lat,lon){
  const rad=Math.PI/180,y=d.getFullYear(),doy=dayDiff(mkD(y,1,1),d)+1,g=2*Math.PI/365*(doy-.5);
  const eqt=229.18*(.000075+.001868*Math.cos(g)-.032077*Math.sin(g)-.014615*Math.cos(2*g)-.040849*Math.sin(2*g));
  const dec=.006918-.399912*Math.cos(g)+.070257*Math.sin(g)-.006758*Math.cos(2*g)+.000907*Math.sin(2*g)-.002697*Math.cos(3*g)+.00148*Math.sin(3*g);
  const c=(Math.cos(90.833*rad)-Math.sin(lat*rad)*Math.sin(dec))/(Math.cos(lat*rad)*Math.cos(dec));
  if(c>1)return{polar:"night"};if(c<-1)return{polar:"day"};
  const ha=Math.acos(c)/rad,tz=-new Date(y,d.getMonth(),d.getDate(),12).getTimezoneOffset(),noon=720-4*lon-eqt+tz;
  return{rise:(noon-4*ha)/60,set:(noon+4*ha)/60};
}
let SUNC={k:"",v:null};
function sunToday(){
  const d=new Date(),k=dkey(d)+(S.wxLoc?S.wxLoc.lat+","+S.wxLoc.lon+","+S.wxLoc.off:"");if(SUNC.k===k)return SUNC.v;
  const L=S.wxLoc,dev=-new Date(d.getFullYear(),d.getMonth(),d.getDate(),12).getTimezoneOffset();
  let lat,lon;
  if(L&&isFinite(L.lat)&&isFinite(L.lon)&&(L.off==null||Math.abs(L.off/60-dev)<=60)){lat=+L.lat;lon=+L.lon;}else{const t=tzGuess();lat=t.lat;lon=t.lon;}
  SUNC={k,v:sunTimes(d,lat,lon)};return SUNC.v;
}
function dayPhase(){ // "night", "dawn", "day", "dusk"
  const t=sunToday(),n=new Date(),h=n.getHours()+n.getMinutes()/60;
  if(t.polar)return t.polar;
  if(h<t.rise-.5||h>=t.set+.75)return"night";
  if(h<t.rise+1)return"dawn";
  if(h<t.set-1)return"day";
  return"dusk";
}
const hhmm=h=>{const m=Math.round(h*60);return Math.floor(m/60)%24+":"+String(m%60).padStart(2,"0");};

// Wetterarten (WMO-Wettercodes wie beim Wetterdienst Open-Meteo)
const WX={sun:{n:"Sonnig",e:"☀️",ne:"🌙"},partly:{n:"Heiter",e:"⛅",ne:"☁️"},cloud:{n:"Bewölkt",e:"☁️"},fog:{n:"Nebel",e:"🌫️"},
  drizzle:{n:"Nieselregen",e:"🌦️",ne:"🌧️"},rain:{n:"Regen",e:"🌧️"},storm:{n:"Gewitter",e:"⛈️"},snow:{n:"Schnee",e:"🌨️"}};
const RAINY=new Set(["drizzle","rain","storm"]);
function codeKind(c){
  if(c<=1)return"sun";if(c===2)return"partly";if(c===3)return"cloud";if(c===45||c===48)return"fog";
  if(c>=51&&c<=57)return"drizzle";if((c>=61&&c<=67)||(c>=80&&c<=82))return"rain";if((c>=71&&c<=77)||c===85||c===86)return"snow";if(c>=95)return"storm";
  return"cloud";
}
const GW={ // Spielwetter: wie oft welches Wetter je Jahreszeit
  spring:[["sun",30],["partly",25],["cloud",15],["drizzle",12],["rain",10],["storm",3],["fog",5]],
  summer:[["sun",45],["partly",22],["cloud",8],["rain",9],["storm",10],["drizzle",3],["fog",3]],
  autumn:[["sun",18],["partly",18],["cloud",20],["fog",16],["drizzle",12],["rain",14],["storm",2]],
  winter:[["sun",18],["partly",14],["cloud",24],["fog",12],["snow",26],["drizzle",6]],
  tropic:[["sun",32],["partly",25],["cloud",10],["rain",17],["storm",14],["drizzle",2]]};
const GT={spring:13,summer:24,autumn:11,winter:1,tropic:30},KT={sun:3,partly:1,cloud:0,fog:-2,drizzle:-2,rain:-3,storm:1,snow:0};
function hash01(n){const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);}
function gameWx(now){ // gleich für 2 Stunden, auch nach dem Neuladen
  const slot=Math.floor(now/(2*HOUR)),s=seasonAt(new Date(now)),tab=GW[s],sum=tab.reduce((a,b)=>a+b[1],0);
  let r=hash01(slot)*sum,kind=tab[0][0];for(const[k,w]of tab){if(r<w){kind=k;break;}r-=w;}
  const h=new Date(now).getHours();
  let temp=Math.round(GT[s]+KT[kind]+4*Math.cos((h-15)/24*TAU)+(hash01(slot+7)-.5)*6);
  if(kind==="snow")temp=Math.min(temp,0);
  return{src:"game",kind,temp,wind:Math.round(4+hash01(slot+13)*26+(kind==="storm"?25:0))};
}
function manTemp(kind){return kind==="snow"?-2:Math.round(GT[season()]+KT[kind]);}
function setManual(kind){
  S.wxMan=kind&&WX[kind]?{kind,temp:manTemp(kind),until:Date.now()+3*HOUR}:null;
  wxC=null;if(S.wxMan)wxSeen(kind);save();ui();
}
let wxC=null;
function wxNow(){ // aktuelles Wetter: selbst eingestellt > live > Spielwetter
  const now=Date.now();if(wxC&&now-wxC.at<1000&&now>=wxC.at)return wxC;
  let w;const M=S.wxMan,L=S.wxLive;
  if(M&&M.until>now&&WX[M.kind])w={src:"manual",kind:M.kind,temp:M.temp,wind:12,until:M.until};
  else if(L&&now-L.t<3*HOUR&&WX[L.kind])w={src:"live",kind:L.kind,temp:L.temp,wind:L.wind||0,t:L.t};
  else w=gameWx(now);
  w.at=now;return wxC=w;
}
const isCold=w=>w.temp<=4,isHot=w=>w.temp>=28;
function snowCover(){const w=wxNow();return season()!=="tropic"&&(w.kind==="snow"||(!!S.snowT&&Date.now()-S.snowT<12*HOUR&&w.temp<=2));}
function wxEmoji(w){const k=WX[w.kind],ph=dayPhase();return(ph==="night"||(S.sleep&&petHere()))&&k.ne?k.ne:k.e;}
function wxSeen(k){const g={partly:"sun",drizzle:"rain"}[k]||k;if(!S.wxSeen.includes(g))S.wxSeen.push(g);}

// Live-Wetter von Open-Meteo (geht nur, wenn das Spiel direkt im Browser läuft)
const WX_API="https://api.open-meteo.com/v1/forecast",GEO_API="https://geocoding-api.open-meteo.com/v1/search";
let wxBusy=false,wxNote="",wxFailT=0;
function inChat(){try{return!!window.claude;}catch(e){return false;}}
async function getJSON(url){
  const ctl=typeof AbortController==="function"?new AbortController():null,to=setTimeout(()=>{if(ctl)ctl.abort();},9000);
  try{const r=await fetch(url,ctl?{signal:ctl.signal}:{});if(!r.ok)throw new Error("http "+r.status);return await r.json();}
  finally{clearTimeout(to);}
}
const netErr=()=>typeof navigator!=="undefined"&&navigator.onLine===false?"offline":"fail";
async function wxFetch(force){
  const L=S.wxLoc;if(!L||wxBusy)return;
  if(inChat()){wxNote="chat";return;}
  const now=Date.now();
  if(!force&&((S.wxLive&&now-S.wxLive.t<20*MIN&&now>=S.wxLive.t)||now-wxFailT<5*MIN))return;
  wxBusy=true;wxNote="busy";kalRefresh();
  try{
    const d=await getJSON(`${WX_API}?latitude=${(+L.lat).toFixed(3)}&longitude=${(+L.lon).toFixed(3)}&current=temperature_2m,weather_code,is_day,wind_speed_10m&daily=sunrise,sunset&timezone=auto&forecast_days=1`);
    const c=d&&d.current||{},cw=d&&d.current_weather||{};
    const code=c.weather_code??cw.weathercode??cw.weather_code,temp=c.temperature_2m??cw.temperature;
    if(typeof code!=="number"||typeof temp!=="number"||!isFinite(temp))throw new Error("data");
    if(S.wxLoc!==L)return;
    S.wxLive={t:Date.now(),code,kind:codeKind(code),temp:Math.round(temp),wind:Math.max(0,Math.round(+(c.wind_speed_10m??cw.windspeed??cw.wind_speed??0)||0))};
    if(typeof d.utc_offset_seconds==="number")L.off=d.utc_offset_seconds;
    wxNote="ok";wxFailT=0;wxC=null;wxSeen(S.wxLive.kind);save();
  }catch(e){wxNote=netErr();wxFailT=Date.now();}
  finally{wxBusy=false;ui();kalRefresh();}
}
async function wxSearch(q){
  q=String(q||"").trim();if(q.length<2)return{err:"short"};
  if(inChat())return{err:"chat"};
  try{
    const d=await getJSON(`${GEO_API}?name=${encodeURIComponent(q)}&count=5&language=de&format=json`);
    const list=(d&&Array.isArray(d.results)?d.results:[]).filter(x=>isFinite(x.latitude)&&isFinite(x.longitude)&&x.name)
      .map(x=>({name:String(x.name),area:[x.admin1,x.country].filter(Boolean).join(", "),lat:+x.latitude,lon:+x.longitude}));
    return{list};
  }catch(e){return{err:netErr()};}
}
function setLoc(o){
  S.wxLoc={name:String(o.name).slice(0,40),area:String(o.area||"").slice(0,60),lat:+o.lat,lon:+o.lon};
  S.wxLive=null;S.wxMan=null;wxC=null;SUNC.k="";wxFailT=0;save();ui();wxFetch(true);
}
function clearLoc(){S.wxLoc=null;S.wxLive=null;wxC=null;SUNC.k="";wxNote="";save();ui();kalRefresh();}
function wxLocate(){
  if(inChat()){wxNote="chat";kalRefresh();return;}
  if(!navigator.geolocation){wxNote="nogeo";kalRefresh();return;}
  wxNote="locating";kalRefresh();
  navigator.geolocation.getCurrentPosition(p=>{kalReset();setLoc({name:"Mein Standort",area:"",lat:p.coords.latitude,lon:p.coords.longitude});},
    ()=>{wxNote="nogeo";kalRefresh();},{timeout:12000,maximumAge:HOUR});
}
function wxAuto(){if(S.wxLoc&&!document.hidden)wxFetch(false);}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)setTimeout(wxAuto,800);});

// Wetter wirkt: nur solange das Spiel offen ist (alle 5 Sekunden)
const wxMsgT={};
function wxMsg(k,fn,gap){const n=Date.now();if((wxMsgT[k]||0)>n)return;wxMsgT[k]=n+(gap||10*MIN);fn();}
function hasUmbrella(){return S.wear.hand==="umbrella";}
function isWarm(){return S.wear.neck==="scarf"||S.wear.head==="beanie"||S.wear.head==="santa"||Date.now()<(S.warmT||0);}
function wxTick(){
  const w=wxNow(),now=Date.now();
  wxSeen(w.kind);if(w.kind==="snow")S.snowT=now;
  {const s=season()==="tropic"?astroSeason(new Date()):season();if(!S.seasonsSeen.includes(s))S.seasonsSeen.push(s);} // in den Tropen zählen die 4 Jahresviertel
  if(RAINY.has(w.kind)){S.rainT=now;rainWater();}
  if(["rain","drizzle","storm","snow","fog"].includes(w.kind))diaryAdd("wx",w.kind==="drizzle"?"rain":w.kind);
  if(isHot(w))diaryAdd("wx","hot");else if(w.temp<=0)diaryAdd("wx","cold");
  if(S.dead||S.sleep||away()||stage()==="egg"||!petHere()||document.hidden)return;
  const out=OUT.has(S.petRoom),f=5/60;
  if(out&&RAINY.has(w.kind)&&!hasUmbrella()){S.clean=clamp(S.clean-1.2*f);wxMsg("wet",()=>{say("Es regnet! Ohne Regenschirm wird es nass und schmutzig.",2600);speak("umbrella");});}
  if(out&&isCold(w)&&!isWarm()){S.happy=clamp(S.happy-.6*f);wxMsg("cold",()=>{say("Brr, ist das kalt! Ein Schal oder eine Mütze hilft.",2600);speak("cold");});}
  else if(out&&w.kind==="snow")S.happy=clamp(S.happy+.5*f);
  if(isHot(w)){S.energy=clamp(S.energy-.4*f*(out?1.5:1));wxMsg("hot",()=>{say("Puh, ist das heiß! Ein Eis oder eine Dusche kühlt ab.",2600);speak("hot");});}
  if(w.kind==="storm"&&now-(S.calmT||0)>2*MIN)S.happy=clamp(S.happy-.5*f);
  if(out&&w.kind==="sun"&&S.wear.eyes==="shades"&&dayPhase()==="day")S.happy=clamp(S.happy+.3*f);
}
function rainWater(){ // echter Regen gießt die Beete
  let n=0;S.farm.forEach((p,i)=>{if(i<S.plots&&p.c&&!p.dead&&!ripe(p)&&p.wa<100){p.wa=100;p.dry=0;n++;}});
  if(n&&S.room==="farm")wxMsg("rainfarm",()=>say("Der Regen gießt deine Beete! 🌧️",2400));
}
function calmPet(){ // Streicheln bei Gewitter beruhigt
  if(wxNow().kind!=="storm")return false;
  const n=Date.now(),first=n-(S.calmT||0)>MIN;S.calmT=n;P.scared=0;
  if(first){S.bond=Math.min(100,(S.bond||0)+2);say(`Keine Angst, ${S.name}! Du bist bei ihm.`,2000);}

// Gewitter: Blitz und Donner
const LIT={a:0,next:4,bolt:null,boom:0};
function updLightning(dt){
  P.scared=Math.max(0,(P.scared||0)-dt);
  LIT.a=Math.max(0,LIT.a-dt*3.2);
  if(wxNow().kind!=="storm"){LIT.boom=0;return;}
  LIT.next-=dt;
  if(LIT.next<=0){
    LIT.next=6+Math.random()*9;LIT.a=1;LIT.bolt=boltPath();LIT.boom=.6+Math.random()*1.2;
    if(petVisible()&&!S.sleep&&!S.dead&&stage()!=="egg"&&!(G&&G.k!=="menu")){P.scared=2.2;if(Math.random()<.3)speak("storm");}
  }
  if(LIT.boom>0){LIT.boom-=dt;if(LIT.boom<=0)thunder();}
}
function boltPath(){const pts=[];let x=40+Math.random()*280,y=0;pts.push([x,y]);while(y<150){y+=14+Math.random()*16;x+=(Math.random()-.5)*28;pts.push([x,y]);}return pts;}
function thunder(){if(muted)return;[52,61,47].forEach((f,i)=>setTimeout(()=>beep(f,.75,.05),i*130));}

// Schneemann im Garten
const SNOWMAN={x:244,y:GROUND-2};
function snowmanState(){return S.snowman&&S.snowman.d===dkey()?S.snowman:{d:dkey(),n:0};}
function snowmanHere(){return S.room==="garten"&&snowCover();}
function tapSnowman(x,y){
  if(!snowmanHere()||Math.hypot(x-SNOWMAN.x,y-(SNOWMAN.y-24))>34)return false;
  const s=snowmanState();
  if(s.n>=3){say("Was für ein schöner Schneemann! ⛄",1600);return true;}
  if(!petHere()||S.sleep||S.dead||stage()==="egg"){say("Dein Tierchen muss beim Bauen dabei sein.",2000);return true;}
  S.snowman={d:dkey(),n:s.n+1};P.target=SNOWMAN.x-46;P.wait=4;beep(700+s.n*160,.06);
  emit("crumb",SNOWMAN.x,SNOWMAN.y-12,9,{spread:30,vy:70,life:.6,g:300,col:"#FFFFFF"});
  if(S.snowman.n>=3){S.coins+=10;S.happy=clamp(S.happy+10);addXP(8);S.nSnowman=(S.nSnowman||0)+1;bumpCoins();tune([784,988,1175,1568],.08);
    say("Schneemann fertig! ⛄ +10 Münzen",2600);diaryAdd("snowman");wishDone("snowman");setTimeout(()=>speak("snow"),900);}
  else say(["Die erste Kugel rollt …","Noch eine Kugel obendrauf …"][s.n],1400);
  save();ui();return true;
}
function wxAdvice(){ // Hinweis unten: was das Wetter gerade verlangt
  if(S.sleep||away()||!petHere()||S.dead||stage()==="egg")return"";
  const w=wxNow(),out=OUT.has(S.room);
  if(w.kind==="storm")return"<b>Gewitter!</b> Dein Tierchen hat Angst. Streichel es, dann beruhigt es sich.";
  if(out&&RAINY.has(w.kind)&&!hasUmbrella())return"<b>Es regnet!</b> Ohne Regenschirm wird es nass und schmutzig."+(S.owned.includes("umbrella")?hb("wearen","Schirm nehmen"):hb("shopen","Zum Laden"))+hb("wohn","Rein ins Haus");
  if(out&&isCold(w)&&!isWarm())return"<b>Brr, kalt draußen!</b> Zieh ihm einen Schal oder eine Mütze an."+hb("wearen","Zum Schrank")+hb("wohn","Rein ins Haus");
  if(isHot(w)&&S.energy<60)return"<b>Puh, ist das heiß!</b> Ein Eis oder eine Dusche kühlt ab."+hb("food","Zur Küche");

}

// ===== Wetter und Jahreszeiten zeichnen =====
function drawSeasonTree(){ // Baum im Garten verändert sich mit der Jahreszeit
  const s=season(),k=sky(),x=306,b=230,night=k.night;
  if(s==="tropic"){palm(x,b,night);return;}
  const tc=night?"#4A3626":"#8A5A3C";
  cx.fillStyle=tc;cx.beginPath();cx.moveTo(x-8,b);cx.lineTo(x-5,b-62);cx.lineTo(x+5,b-62);cx.lineTo(x+8,b);cx.closePath();cx.fill();
  cx.strokeStyle=tc;cx.lineWidth=4;cx.lineCap="round";cx.beginPath();
  cx.moveTo(x,b-50);cx.lineTo(x-24,b-82);cx.moveTo(x,b-56);cx.lineTo(x+22,b-86);cx.moveTo(x,b-62);cx.lineTo(x+2,b-106);cx.stroke();
  if(s==="winter"){if(k.snow)for(const[a,c]of[[-24,-84],[22,-88],[2,-108],[0,-62]])oval(x+a,b+c,7,3,"#FFFFFF");return;}
  const cols=s==="spring"?["#A7DD86","#93D371"]:s==="summer"?["#5DB55A","#4CA64A"]:["#E8913A","#D9542F","#F2B33D"],f=s==="autumn"?.82:1;
  [[0,-96,30],[-24,-82,22],[24,-84,24],[-12,-108,20],[14,-110,20]].forEach(([a,c,r],i)=>{const col=cols[i%cols.length];oval(x+a,b+c,r*f,r*.9*f,night?mix(col,"#1B2246",.55):col);});
  if(s==="spring")for(let i=0;i<14;i++){const a=i*2.4,d=8+(i*7)%22;oval(x+Math.cos(a)*d,b-96+Math.sin(a)*d*.8,2.6,2.6,night?"#9A7E92":"#FFC6DA");}
  if(s==="summer"&&!night)for(const[a,c]of[[-14,-88],[12,-100],[20,-80],[-4,-112]])oval(x+a,b+c,3.4,3.4,"#E84545");
}
function palm(x,b,night){ // in den Tropen steht eine Palme

  cx.strokeStyle=tc;cx.lineWidth=9;cx.lineCap="round";cx.beginPath();cx.moveTo(x,b);cx.quadraticCurveTo(x+14,b-60,x+4,b-118);cx.stroke();

function festOcc(f,y){ // Termine eines Festes im Jahr y: [{d, len}]

}
function festRange(a,b){ // alle Termine, deren Deko-Zeit den Bereich a..b berührt

    const end=addD(o.d,o.len-1),ds=addD(o.d,-(f.pre||0)),de=addD(end,f.post||0);

// Rauschen als Grundstoff für Schnarchen, Schritte im Gras und Regen (je Audio-Kontext einmal)
const NOISE=new WeakMap();
function noiseBuf(c){
  let b=NOISE.get(c);if(b)return b;
  const n=Math.floor(c.sampleRate*2);b=c.createBuffer(1,n,c.sampleRate);const d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
  NOISE.set(c,b);return b;
}
function env(g,t,peak,a,len){ // weich ein- und ausblenden
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(.0001,t+len);
}
function audioOn(){return AC&&AC.state==="running"?AC:null;} // erst nach dem ersten Antippen, so wollen es die Browser

// Schnarchen: „Chrrr …“ beim Einatmen, leises „Pfiii“ beim Ausatmen
function snoreAt(c,dest,t,vol){
  const n=c.createBufferSource();n.buffer=noiseBuf(c);
  const bp=c.createBiquadFilter();bp.type="bandpass";bp.Q.value=1.1;bp.frequency.setValueAtTime(240,t);bp.frequency.linearRampToValueAtTime(420,t+1.1);
  const o=c.createOscillator();o.type="sawtooth";o.frequency.setValueAtTime(78,t);o.frequency.linearRampToValueAtTime(96,t+1.1);
  const lp=c.createBiquadFilter();lp.type="lowpass";lp.frequency.value=520;
  const rat=c.createGain();rat.gain.value=.5;const lfo=c.createOscillator();lfo.frequency.value=26;const lg=c.createGain();lg.gain.value=.45;
  const g=c.createGain();env(g,t,vol,.5,1.25);
  const nm=c.createGain();nm.gain.value=4;const om=c.createGain();om.gain.value=1;
  lfo.connect(lg);lg.connect(rat.gain);
  n.connect(bp);bp.connect(nm);nm.connect(rat);o.connect(lp);lp.connect(om);om.connect(rat);rat.connect(g);g.connect(dest);
  n.start(t,Math.random()*.5,1.35);o.start(t);o.stop(t+1.35);lfo.start(t);lfo.stop(t+1.35);
  const w=c.createOscillator(),g2=c.createGain();w.type="sine";w.frequency.setValueAtTime(860,t+1.5);w.frequency.exponentialRampToValueAtTime(560,t+2.2);
  env(g2,t+1.5,vol*.12,.12,.75);w.connect(g2);g2.connect(dest);w.start(t+1.5);w.stop(t+2.3);
  return 2.3;
}
// Schritte: Holz „tock“, Fliesen „tick“, Gras „schff“
function stepAt(c,dest,t,kind,foot,vol){
  const v=vol*(foot?1:.82);
  if(kind==="grass"){const n=c.createBufferSource(),lp=c.createBiquadFilter(),g=c.createGain();n.buffer=noiseBuf(c);lp.type="lowpass";lp.frequency.value=foot?1100:900;
    env(g,t,v*2.4,.012,.09);n.connect(lp);lp.connect(g);g.connect(dest);n.start(t,Math.random()*1.5,.12);return .12;}
  const o=c.createOscillator(),g=c.createGain(),f=kind==="tile"?(foot?420:380):(foot?190:165);
  o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+.07);env(g,t,v,.004,.08);o.connect(g);g.connect(dest);o.start(t);o.stop(t+.1);
  const n=c.createBufferSource(),hp=c.createBiquadFilter(),g2=c.createGain();n.buffer=noiseBuf(c);hp.type="highpass";hp.frequency.value=kind==="tile"?3200:1800;
  env(g2,t,v*.35,.002,.03);n.connect(hp);hp.connect(g2);g2.connect(dest);n.start(t,Math.random()*1.5,.05);
  return .1;
}
// Piepsstimme: kleine Silben, so viele wie der Satz hat (höchstens 9)
function chirpAt(c,dest,t0,txt,vol){
  const syl=Math.max(2,Math.min(9,(String(txt||"").match(/[aeiouyäöü]+/gi)||[]).length));let t=t0;
  for(let i=0;i<syl;i++){
    const o=c.createOscillator(),g=c.createGain(),f=640+((i*137)%5)*48+Math.random()*50,d=.075+Math.random()*.04;
    o.type="sine";o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*(i%2?1.24:.84),t+d);
    env(g,t,vol,.012,d);o.connect(g);g.connect(dest);o.start(t);o.stop(t+d+.02);t+=d+.035;
  }
  return t-t0;
}
function chirp(txt){const c=audioOn();if(c)chirpAt(c,c.destination,c.currentTime+.02,txt,.07);}

// Regen: leises Rauschen, drinnen gedämpft
let RAIN=null;
function rainNode(c){
  if(RAIN&&RAIN.c===c)return RAIN;
  const src=c.createBufferSource(),hp=c.createBiquadFilter(),lp=c.createBiquadFilter(),g=c.createGain();
  src.buffer=noiseBuf(c);src.loop=true;hp.type="highpass";hp.frequency.value=450;lp.type="lowpass";lp.frequency.value=3200;g.gain.value=0;
  src.connect(hp);hp.connect(lp);lp.connect(g);g.connect(c.destination);src.start();
  return RAIN={c,g,lp,lvl:0,out:true};
}
function rainLevel(k){
  const w=wxNow();if(!S.snd.rain||muted||document.hidden||k==="dream"||!RAINY.has(w.kind))return 0;
  const out=k?["visit","run","catch","pop"].includes(k):OUT.has(S.room);

}
function rainSet(c,lvl,k){
  if(!RAIN&&!lvl)return;const n=rainNode(c),out=k?true:OUT.has(S.room);
  if(Math.abs(n.lvl-lvl)>1e-4){n.lvl=lvl;n.g.gain.setTargetAtTime(lvl,c.currentTime,.5);}
  if(n.out!==out){n.out=out;n.lp.frequency.setTargetAtTime(out?3200:800,c.currentTime,.3);}
}
function rainHush(){if(RAIN){RAIN.lvl=0;try{RAIN.g.gain.cancelScheduledValues(RAIN.c.currentTime);RAIN.g.gain.setValueAtTime(0,RAIN.c.currentTime);}catch(e){}}}

// jedes Bild: Schnarchen und Schritte nur, wenn man das Tierchen sieht
let snoreNext=0,stepN=-1,stepFoot=0;

// Stimme: liest die Sätze aus der Sprechblase vor (Bisaya mit passender Stimme, Deutsch mit deutscher Stimme)
// Stimmklang: von zuckersüß bis Brummbär (Tonhöhe, Tempo, bevorzugt weibliche oder männliche Stimmen des Geräts)
const VTYPES=[["zucker","🍬 Zuckersüß",2,1.08,"f"],["suess","🧸 Süß",1.75,1,"f"],["kind","🧒 Kindlich",1.4,1.04,"f"],
  ["natur","🙂 Natürlich",1,1,""],["mann","🧔 Männlich",.8,.97,"m"],["baer","🐻 Brummbär",.55,.9,"m"]];
if(!VTYPES.some(v=>v[0]===S.vtype))S.vtype="suess";
if(typeof S.vDe!=="string")S.vDe="";if(typeof S.vBis!=="string")S.vBis="";
const VOX={n:0};
const LANGN={fil:"Filipino",tl:"Tagalog",ceb:"Cebuano",id:"Indonesisch",ms:"Malaiisch",es:"Spanisch",it:"Italienisch",pt:"Portugiesisch",de:"Deutsch"};
const BISPRE=["fil","tl","ceb","id","ms","es","it","pt","de"]; // so ähnlich wie Bisaya klingen diese Sprachen
const MALE=/\b(markus|yannick|martin|stefan|conrad|killian|klaus|hans|jonas|florian|ralf|bernd|christoph|daniel|thomas|alex|fred|ralph|eddy|reed|rocko|grandpa|opa|angelo|ardi|arif|jorge|diego|enrique|juan|carlos|pablo|luca|cosimo|giorgio|male|mann|männlich|man)\b/i;
const FEMALE=/\b(anna|helena|petra|hedda|katja|amala|seraphina|marlene|vicki|sandy|shelley|grandma|oma|blessica|damayanti|gadis|m[oó]nica|paulina|alice|samantha|elsa|ingrid|female|frau|weiblich|woman)\b/i;
const vlang=v=>String(v&&v.lang||"").replace("_","-").toLowerCase(),vid=v=>String(v.voiceURI||v.name||"");
function voxAll(){try{return window.speechSynthesis&&speechSynthesis.getVoices()||[];}catch(e){return[];}}
function voxList(bis){const vs=voxAll();if(!bis)return vs.filter(v=>vlang(v).startsWith("de"));const o=[];for(const p of BISPRE)for(const v of vs)if(vlang(v).startsWith(p)&&!o.includes(v))o.push(v);return o;}
function vtype(){return VTYPES.find(t=>t[0]===S.vtype)||VTYPES[1];}
function voxAuto(bis){ // beste Sprache zuerst, darin eine Stimme, die zum Stimmklang passt
  const L=voxList(bis);if(!L.length)return null;
  const pre=bis?BISPRE.find(p=>L.some(v=>vlang(v).startsWith(p))):"de",grp=L.filter(v=>vlang(v).startsWith(pre)),pick=a=>a.find(v=>v.localService)||a[0];
  const g=vtype()[4],want=g==="m"?MALE:g==="f"?FEMALE:null,not=g==="m"?FEMALE:MALE;
  if(want){const m=grp.filter(v=>want.test(v.name)&&!not.test(v.name));if(m.length)return pick(m);}
  if(g==="m"){const m=grp.filter(v=>!FEMALE.test(v.name));if(m.length)return pick(m);}
  return pick(grp);
}
function voxGet(bis){const id=bis?S.vBis:S.vDe;if(id){const v=voxAll().find(v=>vid(v)===id);if(v)return v;}return voxAuto(bis);}

try{if(window.speechSynthesis){voxPick();if(speechSynthesis.addEventListener)speechSynthesis.addEventListener("voiceschanged",voxPick);else speechSynthesis.onvoiceschanged=voxPick;}}catch(e){}
function ttsOK(){try{return!!window.speechSynthesis&&typeof window.SpeechSynthesisUtterance==="function"&&VOX.n>0;}catch(e){return false;}}
const noEmo=s=>String(s||"").replace(/\p{Extended_Pictographic}|️|‍/gu,"").replace(/[()„“"]/g,"").replace(/\s+/g," ").trim();
function voiceParts(b,d){return S.voice==="bisaya"?[[b,1]]:S.voice==="deutsch"?[[d,0]]:[[b,1],[d,0]];}
function speakNow(parts){
  const sy=window.speechSynthesis,busy=sy.speaking||sy.pending,ty=vtype();
  const go=()=>{try{if(sy.paused)sy.resume();for(const[txt,bis]of parts){const t=noEmo(txt);if(!t)continue;
    const u=new SpeechSynthesisUtterance(t),v=voxGet(bis);
    if(v){u.voice=v;u.lang=v.lang;}else u.lang=bis?"fil-PH":"de-DE";
    const gv=!v?"":MALE.test(v.name)?"m":FEMALE.test(v.name)?"f":"";let pit=ty[2];
    if(ty[4]==="m"&&gv!=="m")pit*=.82;else if(ty[4]==="f"&&gv==="m")pit=Math.min(2,pit*1.12); // passt die Gerätestimme nicht, Tonhöhe nachhelfen

let gestured=false; // Browser erlauben Ton und Stimme erst, nachdem man einmal getippt hat

function talkVoice(b,d,force){ // force: Probe hören (auch wenn das Tierchen gerade nicht zu sehen ist)
  if(muted||S.voice==="aus"||document.hidden||(!force&&!petVisible())||!hasGesture())return false;

if(typeof S.photo!=="string"||!/^data:image\/(jpeg|png|webp);base64,/.test(S.photo))S.photo="";

const FACE={img:null,src:"",ok:false};
function faceImg(){ // Foto als Bild laden (einmal je Foto)
  if(!S.photo){FACE.ok=false;FACE.src="";return null;}
  if(FACE.src!==S.photo){FACE.src=S.photo;FACE.ok=false;const im=new Image(),src=S.photo;
    im.onload=()=>{if(FACE.src===src){FACE.img=im;FACE.ok=true;}};im.onerror=()=>{if(FACE.src===src)FACE.ok=false;};im.src=src;}
  return FACE.ok?FACE.img:null;
}
function photoActive(){return!!S.photo&&S.photoOn&&!S.dead&&!!faceImg();}
function faceGeo(x,t,w,h,r){const lk=P.look*r*.1;return{x:x+lk*.6,y:t+h*.5+r*.04,R:r*.6};}
const EYE_DX=.36,EYE_DY=-.12; // wo die Augen sitzen (Hilfspunkte beim Foto, Glanz, Blinzeln, Brille)
const smooth=(a,b,v)=>{const q=Math.max(0,Math.min(1,(v-a)/(b-a)));return q*q*(3-2*q);};
function darkTone(c){const[h,s]=rgb2hsl(hx(c));return hsl2hex(h,Math.min(.85,s*1.15),.27);} // dunkler Ton der eigenen Farbe
// Aus dem Foto werden nur die dunklen Züge genommen (Augen, Brauen, Mund, Haare) und in der Farbe des Tierchens
// weich in den Körper gemalt. Die Haut wird zur Körperfarbe, einen Rand oder Kreis gibt es nicht.
const FT={key:"",c:null,n:0};
function faceTex(c2){
  const im=faceImg();if(!im)return null;
  const key=FACE.src.length+"|"+FACE.src.slice(-32)+"|"+c2+"|"+S.faceMix;
  if(FT.key===key&&FT.c)return FT.c;
  const N=128,c=FT.c||document.createElement("canvas");c.width=N;c.height=N;
  const g=c.getContext("2d",{willReadFrequently:true});g.clearRect(0,0,N,N);g.drawImage(im,0,0,N,N);
  let d;try{d=g.getImageData(0,0,N,N);}catch(e){return null;}
  const p=d.data,L=new Float32Array(N*N),hist=[];
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=y*N+x,o=i*4,dx=(x+.5)/N*2-1,dy=(y+.5)/N*2-1;
    L[i]=(.299*p[o]+.587*p[o+1]+.114*p[o+2])/255;if(dx*dx+dy*dy<.45)hist.push(L[i]);}
  hist.sort((a,b)=>a-b); // Helligkeit messen, damit es bei jedem Licht gleich gut aussieht
  const lo=hist[Math.floor(hist.length*.03)]||0,hi=hist[Math.floor(hist.length*.85)]||1,span=Math.max(.1,hi-lo),tone=hx(darkTone(c2)),mix=S.faceMix;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const i=y*N+x,o=i*4,dx=(x+.5)/N*2-1,dy=(y+.5)/N*2-1,rr=Math.sqrt(dx*dx+dy*dy);
    const a=(1-smooth(.6,1,rr))*smooth(.2,.88,1-Math.min(1,Math.max(0,(L[i]-lo)/span)))*mix;
    p[o]=255+(tone[0]-255)*a;p[o+1]=255+(tone[1]-255)*a;p[o+2]=255+(tone[2]-255)*a;p[o+3]=255; // weiß = Körper bleibt, wie er ist
  }
  g.putImageData(d,0,0);FT.key=key;FT.c=c;FT.n++;return c;
}
function drawFaceBlend(x,t,w,h,r,c1,c2){
  const tex=faceTex(c2);if(!tex)return false;const f=faceGeo(x,t,w,h,r);
  cx.save();cx.globalCompositeOperation="multiply";cx.drawImage(tex,f.x-f.R,f.y-f.R,f.R*2,f.R*2);cx.restore();
  const er=f.R*.15,ink="#2A2230",E=[[f.x-f.R*EYE_DX,f.y+f.R*EYE_DY],[f.x+f.R*EYE_DX,f.y+f.R*EYE_DY]];
  if(S.sleep||P.blink>0){ // Augen zu: mit der Körperfarbe zudecken, dann Lidstrich
    const g=cx.createRadialGradient(x-w*.35,t+h*.3,r*.1,x,t+h*.6,r*1.4);g.addColorStop(0,"#FFFFFF");g.addColorStop(.45,c1);g.addColorStop(1,c2);
    cx.fillStyle=g;for(const[X,Y]of E){cx.beginPath();cx.ellipse(X,Y,er*1.7,er*1.3,0,0,TAU);cx.fill();}
    cx.strokeStyle=ink;cx.lineCap="round";cx.lineWidth=Math.max(2,r*.045);for(const[X,Y]of E){cx.beginPath();cx.arc(X,Y-er*.5,er*1.1,.15*Math.PI,.85*Math.PI);cx.stroke();}
  }else for(const[X,Y]of E)oval(X+er*.45,Y-er*.45,er*.32,er*.32,"rgba(255,255,255,.9)"); // Glanz in den Augen
  for(const s of[-1,1])oval(f.x+s*f.R*.66,f.y+f.R*.32,r*.11,r*.065,has("cuddly")?"rgba(255,95,140,.62)":"rgba(255,105,145,.38)");
  return true;
}

function fcDist(p){const[a,b]=[...p.values()];return Math.hypot(a[0]-b[0],a[1]-b[1])||1;}

function fcFile(file){ // Foto vom Gerät

    c.width=Math.max(1,Math.round(im.naturalWidth*m));c.height=Math.max(1,Math.round(im.naturalHeight*m));c.getContext("2d").drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);

function quizQuestions(n){

  const pick=[],today=WORDS.indexOf(wotd());
  if(today>=0&&wKnow(WORDS[today][0])<LEARNED)pick.push(today);
  for(const i of fresh.concat(old))if(pick.length<n&&!pick.includes(i))pick.push(i);
  return shuffle(pick).map(i=>{
    const w=WORDS[i],pic=PICQ.has(w[3])&&Math.random()<.6,same=shuffle(idx.filter(j=>j!==i&&WORDS[j][3]===w[3])),other=shuffle(idx.filter(j=>j!==i&&WORDS[j][3]!==w[3]));

  });
}

// Aussprache vereinfachen: so klingen Bisaya-Wörter auch dann gleich, wenn ein deutsches Gerät sie anders schreibt
function phon(s){
  s=String(s||"").toLowerCase().replace(/ä/g,"e").replace(/ö/g,"o").replace(/ü/g,"u").replace(/ß/g,"s").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z ]/g," ");
  s=s.replace(/ph/g,"f").replace(/ck/g,"k").replace(/[cq]/g,"k").replace(/z/g,"s").replace(/v/g,"w").replace(/j/g,"y").replace(/ie/g,"i").replace(/ei|ai/g,"ay").replace(/au|ao/g,"aw")
    .replace(/o/g,"u").replace(/e/g,"i").replace(/h/g,"").replace(/d/g,"t").replace(/g/g,"k").replace(/b/g,"p").replace(/(.)\1+/g,"$1"); // weich und hart klingen gleich
  return s.replace(/\s+/g," ").trim();
}
function lev(a,b){
  if(a===b)return 0;const m=a.length,n=b.length;if(!m||!n)return m||n;
  let prev=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){const cur=[i];for(let j=1;j<=n;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}
  return prev[n];
}
const tol=w=>w.length<=3?0:w.length<=7?1:2;
function heardLike(texts,word){ // klingt etwas Gehörtes wie das Wort? (ganzer Satz oder ein einzelnes Wort daraus)
  const t=phon(word),nw=t.split(" ").length;let best=99;
  for(const raw of texts){const p=phon(raw),ws=p.split(" ").filter(Boolean);
    const cands=[p];for(let i=0;i+nw<=ws.length;i++)cands.push(ws.slice(i,i+nw).join(" "));if(nw===1&&ws.length>1)cands.push(ws.join(""));
    for(const c of cands){const d=lev(c,t);if(d<best)best=d;}}
  return best<=tol(t)?best:-1;
}

function matchTrick(texts){
  let best=null,bd=99;

}
let micRec=null;
function micErrText(code){
  if(code==="nosr")return"Dein Browser kann leider keine Sprache erkennen. Probier Chrome oder Safari.";
  if(code==="blocked")return inChat()?"Das Mikrofon ist im Chat gesperrt. Öffne das Spiel aus der ZIP-Datei oder als App, dann klappt es.":"Bitte erlaube das Mikrofon für diese Seite (Symbol neben der Adresse).";
  if(code==="nomic")return"Kein Mikrofon gefunden.";
  if(code==="net")return"Für die Spracherkennung braucht dein Gerät Internet.";
  if(code==="nospeech")return"Ich habe nichts gehört. Tippe nochmal und sprich deutlich.";
  return"Das hat nicht geklappt. Versuch es nochmal.";
}
function micListen(onWords,onFail){
  const API=micAPI();if(!API){onFail("nosr");return false;}
  if(micRec){try{micRec.abort();}catch(e){}micRec=null;}
  let rec,done=false;
  try{rec=new API();}catch(e){onFail("nosr");return false;}
  micRec=rec;rec.lang="de-DE";rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=5;
  const end=(fn,arg)=>{if(done)return;done=true;clearTimeout(to);if(micRec===rec)micRec=null;micUI(false);fn(arg);};
  const to=setTimeout(()=>{try{rec.stop();}catch(e){}end(onFail,"nospeech");},8000);
  rec.onresult=ev=>{const out=[];try{for(const r of ev.results)for(let i=0;i<r.length;i++)if(r[i]&&r[i].transcript)out.push(r[i].transcript);}catch(e){}
    if(out.length)end(onWords,out);else end(onFail,"nospeech");};
  rec.onerror=ev=>{const e=ev&&ev.error;end(onFail,e==="not-allowed"||e==="service-not-allowed"?"blocked":e==="audio-capture"?"nomic":e==="network"?"net":e==="no-speech"||e==="aborted"?"nospeech":"fail");};
  rec.onend=()=>end(onFail,"nospeech");
  try{rec.start();}catch(e){end(onFail,"blocked");return false;}
  micUI(true);return true;
}

function decoBuyPlace(id){ // im Einrichten direkt kaufen und hinstellen

function decoPad(){
  if(!G||G.k!=="deco")return;
  if(G.sub==="add"){ // alle Möbel: erst was im Lager liegt, dann zum Kaufen
    const lager=Object.keys(DECO).filter(id=>furnFree(id)>0),kauf=Object.keys(DECO).filter(id=>furnFree(id)<1&&DECO[id].cost).sort((a,b)=>DECO[a].cost-DECO[b].cost);
    const items=lager.map(id=>({t:`${DECO[id].e} ${DECO[id].n}`,sub:`${furnFree(id)} im Lager · hinstellen`,f:()=>decoPlace(id),cls:"game"}))
      .concat(kauf.map(id=>({t:`${DECO[id].e} ${DECO[id].n}`,sub:`${DECO[id].cost} Münzen · kaufen`,dis:S.coins<DECO[id].cost,f:()=>decoBuyPlace(id),cls:"game"})));
    items.push({t:"Zurück",f:()=>{G.sub="";decoPad();},cls:"quit"});setPad(items,2);return;
  }
  if(G.sub==="floor"){
    const cur=S.floors[S.room]||"orig";
    setPad(FLOORS.map(f=>({t:(f[2]?"":"↺ ")+f[1],f:()=>decoFloor(f[0]),cls:"paint"+(f[0]===cur?" on":"")})).concat([{t:"Zurück",f:()=>{G.sub="";decoPad();},cls:"quit"}]),2);
    pad.querySelectorAll(".paint").forEach((b,i)=>{const f=FLOORS[i];if(f[2])b.style.setProperty("--sw",f[2]);if(f[2]&&(f[0]==="dunkel"))b.style.color="#FFFFFF";});return;
  }
  if(G.sub==="paint"){
    const cur=S.walls[S.room]||"orig";
    setPad(WALLS.map(w=>({t:(w[2]?"":"↺ ")+w[1],f:()=>decoPaint(w[0]),cls:"paint"+(w[0]===cur?" on":"")})).concat([{t:"Zurück",f:()=>{G.sub="";decoPad();},cls:"quit"}]),2);
    pad.querySelectorAll(".paint").forEach((b,i)=>{const w=WALLS[i];if(w[2])b.style.setProperty("--sw",`linear-gradient(${w[2]},${w[3]})`);});return;
  }
  const n=Object.keys(DECO).reduce((a,id)=>a+furnFree(id),0),cur=WALL[S.walls[S.room]||"orig"][1],sel=G.sel>=0?roomDecor()[G.sel]:null,fp=G.fsel?fixPiece(S.room,G.fsel):null;
  const items=[{t:"＋ Möbel hinstellen",sub:n?`${n} im Lager · mehr im Laden`:"Möbel aussuchen",f:()=>{G.sub="add";decoPad();},cls:"game"},{t:"🎨 Wandfarbe",sub:cur,f:()=>{G.sub="paint";decoPad();},cls:"game"},
    {t:"🟫 Boden",sub:FLOOR[S.floors[S.room]||"orig"][1],f:()=>{G.sub="floor";decoPad();},cls:"game"}];
  if(ROOMS[S.room].my)items.push({t:"✏️ Name und Zeichen",sub:ROOMS[S.room].n,f:()=>{closePad();openSheet("zimmer");},cls:"game"});
  if(sel)items.push({t:`↩ ${DECO[sel.id].n} ins Lager`,f:decoStore,cls:"game wide"});
  if(fp)items.push({t:`↺ ${fp.n} an den alten Platz`,dis:!fx(S.room,fp.id),f:()=>{setFix(S.room,fp.id,0);beep(900,.05);decoPad();save();},cls:"game wide"});
  items.push({t:"Fertig",f:decoDone,cls:"main wide"});
  setPad(items,2);
}
function decoHit(x,y){const list=roomDecor();let best=-1;
  for(let i=0;i<list.length;i++){const o=list[i],d=DECO[o.id];if(x>=o.x-d.w/2-4&&x<=o.x+d.w/2+4&&y>=o.y-d.h-4&&y<=o.y+6){if(best<0||isFront(o)>isFront(list[best])||(isFront(o)===isFront(list[best])&&!d.flat))best=i;}}
  return best;}

const BEAT=.625,DANCE_BARS=8,HIT_X=62,NOTE_V=112; // 96 Schläge pro Minute
function danceNotes(){const n=[];for(let b=0;b<DANCE_BARS;b++)for(const[s,d]of[[0,1],[1,1],[2,-1]])n.push({t:(b*4+s+2)*BEAT,d,hit:0});return n;} // Takt: vor, vor, zurück, Pause
function danceHit(d){
  if(!G||G.k!=="dance"||G.phase!=="play")return;
  let best=null,bd=1;
  for(const n of G.notes)if(!n.hit){const dt=Math.abs(n.t-G.t);if(dt<bd){bd=dt;best=n;}}
  G.press=d;G.pressT=.18;
  if(!best||bd>.28){beep(260,.05,.02);return;}
  if(best.d!==d){best.hit=-1;G.combo=0;G.fb={t:"Andersrum!",c:"#F04848",a:1};P.squash=.25;beep(220,.12);return;}
  const perfect=bd<=.1;best.hit=perfect?2:1;G.score+=perfect?4:3;G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  G.step=Math.max(-2,Math.min(2,G.step+d));
  G.fb={t:perfect?"Perfekt!":"Gut!",c:perfect?"#22A869":"#2EA6FF",a:1};
  if(perfect)jump(150);emit(perfect?"spark":"note",P.x,GROUND-petR(stage())*1.7,perfect?3:1,{spread:40,cols:["#FF5C8D","#FFC94A","#2EA6FF"]});
  if(G.combo>0&&G.combo%6===0){sayRaw("Pit Señor!",`${G.combo} Schritte am Stück!`);emit("confetti",P.x,GROUND-120,14,{spread:120,vy:40,life:1.4,g:160,cols:["#FF5C8D","#FFC94A","#2EA6FF","#22A869"]});}
}

function seniorN(){return S.senior==="oma"?"Oma":S.senior==="opa"?"Opa":"Oma/Opa";}

function stageEm(st){return st==="senior"?(S.senior==="opa"?"👴":"👵"):STAGE_E[st];}

function seniorTitle(){return S.senior==="opa"?`Lolo ${S.name}`:S.senior==="oma"?`Lola ${S.name}`:S.name;}
function fmtLong(ms){const m=Math.max(1,Math.ceil(ms/MIN));if(m<60)return`${m} Min.`;const h=Math.floor(m/60),mm=m%60;if(h<24)return mm?`${h} Std. ${mm} Min.`:`${h} Std.`;
  const d=Math.floor(h/24),hh=h%24;return`${d} ${d===1?"Tag":"Tage"}${hh?` ${hh} Std.`:""}`;}
function fmtAge(m){return m<60?`${m} Min.`:m<1440?`${Math.round(m/60)} Std.`:`${Math.round(m/1440)} ${Math.round(m/1440)===1?"Tag":"Tage"}`;}
function stageRange(k){const t=tempoT();return k===0?`${fmtAge(t[0])}`:k===5?`ab ${fmtAge(t[4]).replace(/Tage$/,"Tagen")}`:`bis ${fmtAge(t[k])}`;}
function nextIn(){const i=stRank(stage()),t=tempoT();return i<5?Math.max(0,(t[i]-lifeAge())*MIN):0;}
function stageProg(){const i=stRank(stage()),t=tempoT();if(i>=5)return 1;const s0=i?t[i-1]:0;return Math.max(0,Math.min(1,(lifeAge()-s0)/(t[i]-s0)));}
function lifeLearn(n){if(!(n>0))return;S.cs.l+=n;S.life.w+=n;}

function gradeOf(v){return v>=85?1:v>=70?2:v>=55?3:v>=40?4:v>=25?5:6;}

function makeReport(st){
  const c=S.cs,n=c.n||0,avg=(k,v)=>n?c[k]/n:v;
  const g=[gradeOf(avg("h",S.hunger)),gradeOf(avg("c",S.clean)),gradeOf(avg("f",S.happy)),gradeOf(avg("e",S.energy)),learnGrade(c.l||0)];
  const o=Math.round(g.reduce((a,b)=>a+b,0)/5);return{st,g,o,coins:REP_COINS[o],t:Date.now()};

function decideTeen(rep){
  S.teen=rep&&rep.o>=5?"rebell":S.life.g>=6?"wirbel":"sonne";

    say("Es hat sich entwickelt: "+FORMS[S.form].n+"!",3000);tune([523,659,784,1046,1318],.1);save();ui();}
}
function lifeAdvance(from,to){
  let rep=null;
  for(let i=from+1;i<=to;i++){
    const prev=STAGES[i-1],now=STAGES[i];
    if(prev!=="egg"){rep=makeReport(prev);S.reps.push(rep);if(S.reps.length>8)S.reps.shift();S.coins+=rep.coins;}

    '<p class="note">Am Ende jeder Stufe gibt es ein Zeugnis: für Essen, Sauberkeit, Spaß, Schlaf und Lernen. Note 1 ist am besten. Gute Noten bringen Münzen.</p>');

  return h;

function setTempo(k){
  if(!TEMPO[k]||k===S.tempo)return;
  const st=stage(),i=stRank(st),o=tempoT(),n=TEMPO[k].t,a=lifeAge();
  let e;
  if(i>=5)e=n[4]+Math.max(0,a-o[4]);
  else{const s0=i?o[i-1]:0,f=Math.max(0,Math.min(.999,(a-s0)/(o[i]-s0))),n0=i?n[i-1]:0;e=n0+f*(n[i]-n0);}
  S.tempo=k;S.ageOff=(Date.now()-S.born)-e*MIN;
  beep(1320,.04);say(`Tempo: ${TEMPO[k].n} · ${TEMPO[k].d}`,2200);save();ui();renderSheet();
}

});

// Eingebaute Möbel: jedes Teil hat seinen Platz (x0..x1, y0..y1) und lässt sich beim Einrichten nach links und rechts schieben
const FIX={
  wohn:[{id:"teppich",n:"Teppich",x0:60,x1:300,y0:257,y1:283,flat:1,d:fxTeppichW},{id:"bild",n:"Bild",x0:40,x1:94,y0:58,y1:100,wall:1,d:fxBild},
    {id:"sofa",n:"Sofa",x0:20,x1:160,y0:176,y1:252,d:fxSofa},{id:"tv",n:"Fernseher",x0:244,x1:330,y0:148,y1:250,d:fxTv}],
  kueche:[{id:"kuehl",n:"Kühl­schrank",x0:18,x1:80,y0:110,y1:250,d:fxKuehl},{id:"theke",n:"Küchen­schrank",x0:92,x1:228,y0:170,y1:250,d:fxTheke},
    {id:"herd",n:"Herd",x0:226,x1:314,y0:108,y1:250,d:fxHerd}],
  bad:[{id:"klo",n:"Toilette",x0:30,x1:82,y0:164,y1:250,d:fxKlo},{id:"becken",n:"Wasch­becken",x0:148,x1:212,y0:104,y1:250,d:fxBecken},
    {id:"dusche",n:"Dusche",x0:256,x1:352,y0:68,y1:274,d:fxDusche}],
  schlaf:[{id:"teppich",n:"Teppich",x0:170,x1:330,y0:259,y1:277,flat:1,d:fxTeppichS},{id:"schrank",n:"Schrank",x0:16,x1:94,y0:104,y1:250,d:fxSchrank},
    {id:"lampe",n:"Nacht­tisch",x0:168,x1:198,y0:174,y1:250,d:fxLampe},{id:"bett",n:"Bett",x0:196,x1:352,y0:150,y1:250,d:fxBett}],
  dach:[{id:"kiste",n:"Spielkiste",x0:18,x1:90,y0:186,y1:250,d:fxKiste}]
};
const FIX_JOB={sofa:"sofa",tv:"tv",toilet:"klo",shower:"dusche",teeth:"becken",bed:"bett"}; // welche Aufgabe an welchem Möbel stattfindet
function fx(r,id){const o=S.fix&&S.fix[r],v=o?o[id]:0;return Number.isFinite(v)?v:0;}
function fixPiece(r,id){return(FIX[r]||[]).find(p=>p.id===id);}
function fixClamp(p,dx){return Math.round(Math.max(-p.x0+2,Math.min(W-2-p.x1,dx)));}
function fixDraw(r){for(const p of(FIX[r]||[]).slice().sort((a,b)=>(b.flat?1:0)-(a.flat?1:0)||(b.wall?1:0)-(a.wall?1:0))){const d=fx(r,p.id);cx.save();cx.translate(d,0);try{p.d();}catch(e){}cx.restore();}}
function fixHit(r,x,y){const l=FIX[r]||[];for(let i=l.length-1;i>=0;i--){const p=l[i],d=fx(r,p.id);if(!p.flat&&x>=p.x0+d-3&&x<=p.x1+d+3&&y>=p.y0-3&&y<=p.y1+3)return p.id;}
  for(const p of l){const d=fx(r,p.id);if(p.flat&&x>=p.x0+d&&x<=p.x1+d&&y>=p.y0-4&&y<=p.y1+4)return p.id;}return"";}
function setFix(r,id,dx){
  const p=fixPiece(r,id);if(!p)return;dx=fixClamp(p,dx);
  if(!S.fix[r])S.fix[r]={};if(dx)S.fix[r][id]=dx;else delete S.fix[r][id];
  if(P.job&&FIX_JOB[P.job.kind]===id&&S.room===r){P.job=null;P.lift=0;} // es benutzt das Möbel gerade: aufstehen
  if(id==="bett"&&r==="schlaf"&&S.sleep&&!S.sw&&S.petRoom==="schlaf"){P.x=P.target=bedX();S.petX=P.x;} // schläft mit im Bett
}
function fixNorm(){
  if(!S.fix||typeof S.fix!=="object"||Array.isArray(S.fix))S.fix={};
  for(const r of Object.keys(S.fix)){const o=S.fix[r];if(!FIX[r]||!o||typeof o!=="object"||Array.isArray(o)){delete S.fix[r];continue;}
    for(const id of Object.keys(o)){const p=fixPiece(r,id);if(!p||!Number.isFinite(o[id]))delete o[id];else o[id]=fixClamp(p,o[id]);}}
}
fixNorm();

// Eigene Zimmer (höchstens 2): leer, zum Einrichten; zu finden auf der Karte
const MY_MAX=2,MY_COST=250,MY_LV=3,MY_EMO=["🧸","🎨","🎮","📚","🎵","🌿","⭐","🏓"];
function myRoomsReg(){ // beim Laden: Zimmer prüfen und als Raum anmelden (ohne Werte von später im Code)
  if(!Array.isArray(S.myRooms))S.myRooms=[];
  const seen=new Set(),emo=["🧸","🎨","🎮","📚","🎵","🌿","⭐","🏓"];
  S.myRooms=S.myRooms.filter(o=>o&&typeof o==="object"&&/^z[12]$/.test(o.id)&&!seen.has(o.id)&&seen.add(o.id)).slice(0,2);
  for(const o of S.myRooms){o.n=String(o.n||"").replace(/\s+/g," ").trim().slice(0,16)||"Mein Zimmer";if(!emo.includes(o.e))o.e="🧸";
    ROOMS[o.id]={n:o.n,e:o.e,my:1,tip:"Dein eigenes Zimmer. Tippe auf „🛠️ Einrichten“ und stell hin, was dir gefällt."};}
  for(const k of Object.keys(ROOMS))if(ROOMS[k].my&&!S.myRooms.some(o=>o.id===k))delete ROOMS[k];
}
function myRoomsHouse(){for(const z of["z1","z2"])if(!S.myRooms.some(o=>o.id===z))HOUSE.delete(z);for(const o of S.myRooms)HOUSE.add(o.id);
  for(const k of["room","petRoom"])if(/^z[12]$/.test(S[k])&&!HOUSE.has(S[k]))S[k]="wohn";} // Zimmer gibt es nicht (mehr): zurück ins Wohnzimmer

function buildRoom(name,emo){
  if(S.myRooms.length>=MY_MAX){say("Mehr Zimmer passen nicht ins Haus.",2200);return false;}
  if(S.level<MY_LV){say(`Eigene Zimmer gibt es ab Level ${MY_LV}.`,2200);return false;}
  if(S.coins<MY_COST){say("Zu wenig Münzen");return false;}
  const id=["z1","z2"].find(z=>!S.myRooms.some(o=>o.id===z));
  S.coins-=MY_COST;S.myRooms.push({id,n:name,e:emo});myRoomsReg();myRoomsHouse();bumpCoins();
  tune([523,659,784,1046,1318],.1);emit("confetti",180,-10,40,{spread:340,vy:-30,vx:120,life:2.4,g:160,cols:["#FF5C8D","#FFC94A","#2EA6FF","#22A869"]});
  diaryAdd("v",["myroom",ROOMS[id].n]);save();closeSheet();go(id);ui();
  say(`${ROOMS[id].e} ${ROOMS[id].n} ist fertig! Du findest es auf der Karte (oben links).`,3400);return true;
}
